<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfa Enterprises — Sales &amp; Incentive Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --surface-sunk:#EBEFF3;
  --ink:#14202E;
  --ink-soft:#526173;
  --ink-faint:#8794A4;
  --border:#D8DFE7;
  --border-soft:#E6EBF0;
  --accent:#1F5F8B;
  --accent-2:#2B7BAE;
  --accent-ink:#123B5A;
  --accent-soft:#DCEAF4;
  --cta:#F59E0B;
  --cta-ink:#2A1A00;
  --positive:#1E8A5A;
  --positive-soft:#DDF1E6;
  --negative:#D2453D;
  --negative-soft:#FBE4E1;
  --warn:#9A6208;
  --warn-soft:#FDF1D6;
  --nav-bg:#13263A;
  --nav-ink:#B9C8D8;
  --radius:12px;
  --radius-sm:8px;
  --radius-pill:999px;
  --sidebar-w:246px;
  --shadow-sm:0 1px 2px rgba(16,32,50,0.06), 0 1px 1px rgba(16,32,50,0.04);
  --shadow-md:0 10px 28px -14px rgba(16,32,50,0.25), 0 2px 6px -2px rgba(16,32,50,0.08);
  --shadow-lg:0 24px 60px -20px rgba(10,22,36,0.4), 0 4px 12px -4px rgba(10,22,36,0.12);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0E1721;
    --surface:#15212E;
    --surface-sunk:#0B121A;
    --ink:#E6EDF4;
    --ink-soft:#9FB0C2;
    --ink-faint:#6A7C90;
    --border:#26364A;
    --border-soft:#1E2C3C;
    --accent:#5AA3D6;
    --accent-2:#7DB9E3;
    --accent-ink:#BFE0F7;
    --accent-soft:#1B3347;
    --cta:#F5A524;
    --cta-ink:#2A1A00;
    --positive:#5FCB98;
    --positive-soft:#16291F;
    --negative:#F07A72;
    --negative-soft:#321C1B;
    --warn:#E8B64F;
    --warn-soft:#2E2512;
    --nav-bg:#0A121B;
    --nav-ink:#9FB0C2;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 10px 28px -14px rgba(0,0,0,0.55), 0 2px 6px -2px rgba(0,0,0,0.3);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,0.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1721;
  --surface:#15212E;
  --surface-sunk:#0B121A;
  --ink:#E6EDF4;
  --ink-soft:#9FB0C2;
  --ink-faint:#6A7C90;
  --border:#26364A;
  --border-soft:#1E2C3C;
  --accent:#5AA3D6;
  --accent-2:#7DB9E3;
  --accent-ink:#BFE0F7;
  --accent-soft:#1B3347;
  --cta:#F5A524;
  --cta-ink:#2A1A00;
  --positive:#5FCB98;
  --positive-soft:#16291F;
  --negative:#F07A72;
  --negative-soft:#321C1B;
  --warn:#E8B64F;
  --warn-soft:#2E2512;
  --nav-bg:#0A121B;
  --nav-ink:#9FB0C2;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  --shadow-md:0 10px 28px -14px rgba(0,0,0,0.55), 0 2px 6px -2px rgba(0,0,0,0.3);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,0.65);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
a{color:inherit;}
::selection{background:var(--accent-soft);}

/* ---- layout ---- */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  box-shadow:1px 0 0 var(--border), 4px 0 24px -18px rgba(20,18,10,0.25);
  z-index:5;
}
#brand{padding:28px 22px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:12px;}
#brand .mark{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(150deg, var(--accent-2), var(--accent) 65%, var(--accent-ink));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;color:#fff;font-size:16px;
  box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.25);
}
#brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:20px;letter-spacing:0.005em;line-height:1.15;}
#brand .word em{font-style:normal;color:var(--accent);}
#brand .sub{color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
nav{padding:16px 12px;flex:1;overflow-y:auto;}
nav a{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--ink-soft);text-decoration:none;font-size:13.5px;font-weight:500;
  margin-bottom:3px;cursor:pointer;
  transition:background .14s ease, color .14s ease, transform .14s ease;
}
nav a svg{width:16px;height:16px;flex-shrink:0;opacity:0.8;}
nav a:hover{background:var(--surface-sunk);color:var(--ink);}
nav a.active{
  background:linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 60%, var(--surface)));
  color:var(--accent-ink);font-weight:600;box-shadow:var(--shadow-sm), inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
}
nav a.active svg{opacity:1;}
#sidebar-foot{padding:16px 22px;border-top:1px solid var(--border-soft);}
#sidebar-foot .rate{font-size:12px;color:var(--ink-soft);}
#sidebar-foot .rate b{color:var(--accent-ink);font-family:'IBM Plex Mono',monospace;}

#main{flex:1;min-width:0;padding:32px 42px 60px;max-width:1260px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.pagehead h1{font-size:27px;font-weight:600;margin:0 0 5px;letter-spacing:-0.01em;}
.pagehead p{margin:0;color:var(--ink-soft);font-size:13.5px;max-width:540px;}
.pagehead .actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ---- buttons/inputs ---- */
button{font-family:inherit;font-size:13px;cursor:pointer;}
.btn{
  padding:9px 15px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
}
.btn:hover{border-color:var(--ink-faint);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(160deg, color-mix(in srgb, var(--ink) 92%, var(--accent)), var(--ink));color:var(--surface);border-color:var(--ink);}
.btn-primary:hover{opacity:0.94;}
.btn-accent{background:linear-gradient(160deg, var(--accent-2), var(--accent));color:#fff;border-color:var(--accent);}
.btn-accent:hover{opacity:0.94;}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none;}
.btn-ghost:hover{background:var(--surface-sunk);box-shadow:none;transform:none;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-danger{color:var(--negative);}
.btn-danger#confirm-ok{color:#fff;background:var(--negative);border-color:var(--negative);}
.sort-arrow{font-size:11px;}
input,select,textarea{
  font-family:inherit;font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 11px;width:100%;
  transition:border-color .12s ease, box-shadow .12s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px;}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.kpi .icon-chip{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;
  background:var(--surface-sunk);color:var(--ink-soft);
}
.kpi .icon-chip svg{width:16px;height:16px;}
.kpi.hero .icon-chip{background:linear-gradient(150deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 40%, var(--surface)));color:var(--accent-ink);}
.kpi .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:2px;}
.kpi .value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
.kpi .value.accent{background:linear-gradient(120deg, var(--accent-ink), var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}
.kpi .value.pos{color:var(--positive);}
.kpi .value.neg{color:var(--negative);}
.kpi .sub{font-size:11px;color:var(--ink-faint);margin-top:5px;}

.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);}
.panel h3{font-size:14px;font-weight:600;margin:0 0 14px;font-family:'IBM Plex Sans',sans-serif;}
.panel-chart{height:230px;position:relative;}
.panel-chart.tall{height:300px;}
tfoot .tot-row td{padding:12px 16px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);border-top:2px solid var(--accent);}
tr .status-cell{display:flex;align-items:center;gap:6px;}
.inc-lock{color:var(--ink-faint);}
.inc-lock.locked{color:var(--positive);}
.inc-lock:hover{background:var(--surface-sunk);color:var(--ink);}
.bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;color:var(--accent-ink);font-weight:600;font-size:13px;}
.exp-total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--radius-sm);font-weight:700;}
h3.share-title{text-align:center;text-transform:uppercase;letter-spacing:.02em;font-weight:800;font-size:17px;}

/* ---- tables ---- */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow-sm);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;padding:11px 16px;font-size:10.5px;color:var(--ink-soft);
  border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;
  background:var(--surface-sunk);position:sticky;top:0;letter-spacing:0.02em;
}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .1s ease;}
tbody tr:hover{background:var(--surface-sunk);}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
td.ref{white-space:normal;max-width:260px;font-weight:500;}
td.ref .sub{font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Sans',sans-serif;}

.pill{display:inline-block;padding:4px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;}
.pill-paid{background:var(--positive-soft);color:var(--positive);}
.pill-partial{background:var(--warn-soft);color:var(--warn);}
.pill-unpaid{background:var(--negative-soft);color:var(--negative);}
.pill-pending{background:var(--surface-sunk);color:var(--ink-faint);}

.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input[type=search]{max-width:240px;}
.toolbar select{width:auto;min-width:130px;}
.toolbar .spacer{flex:1;}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(15,18,12,0.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:100;overflow-y:auto;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:560px;padding:28px 30px 30px;border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:riseIn .18s cubic-bezier(.2,.8,.3,1);}
.modal h2{font-size:19px;margin:0 0 18px;font-weight:600;}
.modal .close{position:absolute;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft);}

/* ---- misc ---- */
.muted{color:var(--ink-faint);}
.hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.empty{padding:50px 20px;text-align:center;color:var(--ink-faint);}
[hidden]{display:none !important;}
.tab-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 16px;}
.tab-check{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:400;color:var(--ink);cursor:pointer;}
.tab-check input{width:auto;}
.tab-checks.off{opacity:.45;pointer-events:none;}
.badge-count{background:var(--surface-sunk);color:var(--ink-soft);border-radius:var(--radius-pill);padding:1px 8px;font-size:11px;margin-left:auto;}
.section-note{font-size:13px;color:var(--ink-soft);background:linear-gradient(135deg, var(--warn-soft), color-mix(in srgb, var(--warn-soft) 50%, var(--surface)));border:1px solid var(--border-soft);border-radius:var(--radius);padding:13px 16px;margin-bottom:18px;}
.rep-group{margin-bottom:24px;}
.rep-group-head{display:flex;justify-content:space-between;align-items:baseline;padding:13px 18px;background:var(--surface-sunk);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;}
.rep-group-head h4{margin:0;font-size:15px;font-family:'Fraunces',serif;font-weight:600;}
.rep-group-head .amt{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent-ink);}
.rep-group .table-wrap{border-radius:0 0 var(--radius) var(--radius);border-top:none;}
.settings-list{display:flex;flex-direction:column;gap:8px;}
.settings-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;}
.settings-row .code{font-family:'IBM Plex Mono',monospace;background:var(--surface-sunk);border-radius:var(--radius-sm);padding:6px 8px;text-align:center;font-size:12px;font-weight:600;}
.toast{position:fixed;bottom:26px;right:26px;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;z-index:200;box-shadow:var(--shadow-lg);animation:riseIn .18s ease;}
.icon-btn{background:transparent;border:none;color:var(--ink-faint);padding:5px;border-radius:var(--radius-sm);transition:background .12s ease,color .12s ease;}
.icon-btn:hover{background:var(--negative-soft);color:var(--negative);}
/* ---- purchasing ---- */
.po-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px;}
.po-grid .span2{grid-column:span 2;}
.po-form{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.po-form .full{grid-column:1/-1;}
.po-table th{padding:9px 8px;}
.po-table td{padding:5px 8px;}
.po-table td.ref{min-width:190px;}
.po-table input.cell,.po-table select.cell{padding:5px 7px;font-size:12.5px;}
.po-table input.n{width:84px;text-align:right;font-family:'IBM Plex Mono',monospace;}
.po-table input.sp{width:92px;}
.row-new td,.charge-row.row-new{animation:rowFlash 1.8s ease;}
@keyframes rowFlash{0%,40%{background:var(--accent-soft);}100%{background:transparent;}}
.po-kpis{grid-template-columns:repeat(7,1fr);gap:10px;}
.po-kpis .kpi{padding:14px 12px 12px;}
.po-kpis .value{font-size:16px;}
.stamp-preview{min-height:110px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:var(--radius-sm);background:#fff;padding:8px;}
.stamp-preview img{max-height:120px;max-width:100%;}
h3.po-sec{margin:0;font-size:15px;font-weight:600;color:var(--accent-ink);}
.charge-row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;}
.charge-row input.n{text-align:right;font-family:'IBM Plex Mono',monospace;}
.check-inline{display:flex;align-items:center;gap:8px;margin:2px 0 0;font-size:13px;color:var(--ink);font-weight:400;cursor:pointer;}
.check-inline input{width:auto;}
@media (max-width:900px){ .po-kpis{grid-template-columns:repeat(2,1fr);} .po-grid{grid-template-columns:1fr 1fr;} .po-form{grid-template-columns:1fr;} }

@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:150;}
  #sidebar.open{transform:translateX(0);}
  #main{padding:20px 16px 60px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .chart-row{grid-template-columns:1fr;}
  #menu-btn{display:inline-flex !important;}
}
.month-tabs{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;background:var(--surface-sunk);padding:4px;border-radius:var(--radius-pill);width:fit-content;max-width:100%;overflow-x:auto;}
.month-tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;border-radius:var(--radius-pill);transition:background .14s ease, color .14s ease;}
.month-tab:hover{color:var(--ink);}
.month-tab.active{color:#fff;background:linear-gradient(135deg, var(--accent-2), var(--accent));font-weight:600;box-shadow:var(--shadow-sm);}
.month-tab-add{padding:8px 14px;font-size:16px;color:var(--ink-faint);cursor:pointer;line-height:1.1;border-radius:var(--radius-pill);transition:background .14s ease,color .14s ease;}
.month-tab-add:hover{color:var(--accent);background:var(--surface);}
#menu-btn{display:none;}
/* ---- 60-30-10 theme: neutral canvas, slate/blue structure, amber for CTAs and status ---- */
#sidebar{background:var(--nav-bg);border-right:none;box-shadow:none;}
#brand{border-bottom:1px solid rgba(255,255,255,0.08);}
#brand .word{color:#fff;}
#brand .word em{color:var(--cta);}
#brand .sub{color:var(--nav-ink);}
#brand .mark{background:linear-gradient(150deg,#2B7BAE,#1F5F8B 65%,#123B5A);}
nav a{color:var(--nav-ink);}
nav a:hover{background:rgba(255,255,255,0.07);color:#fff;}
nav a.active{background:rgba(255,255,255,0.1);color:#fff;box-shadow:inset 3px 0 0 var(--cta);}
#sidebar-foot{border-top:1px solid rgba(255,255,255,0.08);}
#sidebar-foot .rate{color:var(--nav-ink);}
#sidebar-foot .rate b{color:var(--cta);}
.btn-primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta);font-weight:600;}
.btn-primary:hover{opacity:1;filter:brightness(1.06);}
.btn-primary:disabled{opacity:.5;}
.pagehead h1{color:var(--accent-ink);}
:root[data-theme="dark"] .pagehead h1{color:var(--ink);}
thead th{background:var(--accent-soft);color:var(--accent-ink);}
.month-tabs{background:var(--surface-sunk);border:1px solid var(--border-soft);}
.month-tab.active{background:var(--accent);color:#fff;}
.kpi.hero{border-top:3px solid var(--accent);}
.kpi .value.accent{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--accent);}
.panel h3{color:var(--accent-ink);}

<body>
<div id="shell">
  <aside id="sidebar">
    <div id="brand">
      <div class="mark">A</div>
      <div>
        <div class="word">Alfa<em>·</em>Enterprises</div>
        <div class="sub">Sales &amp; incentive ledger</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="sidebar-foot" hidden>
      <div class="rate" id="signed-in-as" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
      <button class="btn btn-sm" id="btn-switch-company" style="margin-top:8px;" hidden>Switch company</button>
      <button class="btn btn-sm" id="btn-signout" style="margin-top:8px;">Sign out</button>
    </div>
  </aside>
  <main id="main">
    <button id="menu-btn" class="btn btn-sm" style="position:fixed;top:14px;left:14px;z-index:160;">☰</button>
    <div id="page"></div>
  </main>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const DEFAULT_REP_NAMES = {A:'Rep A', C:'Rep C', F:'Rep F', H:'Rep H', J:'Rep J', M:'Rep M'};
const DEFAULT_CHANNEL_NAMES = {IM:'IM', A:'A', G:'G', C:'C'};

let state = {
  orders: [],
  reps: {},        // code -> name
  channels: {},    // code -> name
  settings: {incentiveRate: 5},
  expenses: {salaries:0, rent:0, electricity:0, fuel:0, marketing:0, other:0},
  months: [],       // list of ledger-month tabs (YYYY-MM), manually added or inferred
  ready: false,
  me: null,         // signed-in user's users/{uid} doc: {email,name,role,access,active}
  users: [],        // all users (admin only)
  vendors: [], products: [], hscodes: [], pos: [],  // purchasing masters and purchase orders
  purchasing: {},   // meta/purchasing: buyer details, markups, default charges and terms
};
let db = null;
let currentPage = 'dashboard';
let editingOrderId = null;
let charts = {};

/* ============================================================
   CALC HELPERS
   ============================================================ */
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

/* Standing rule: these salesmen are owners and never earn incentive. */
const NON_INCENTIVE_REPS = ['f','m'];
function isNonIncentiveRep(code){
  const c = String(code||'').trim().toLowerCase();
  const n = String((state.reps||{})[code]||'').trim().toLowerCase();
  return NON_INCENTIVE_REPS.includes(c) || NON_INCENTIVE_REPS.includes(n);
}
function computeOrder(o){
  const grossSales = Number(o.grossSales)||0;
  const gstRate = Number(o.gstRate)||0;
  const totalCost = (o.totalCost===null || o.totalCost===undefined || o.totalCost==='') ? null : Number(o.totalCost);
  const status = o.paymentStatus || 'none'; // 'none' | 'partial' | 'full'

  let grossProfit = null, netProfit = null;
  if(totalCost !== null){
    grossProfit = round2(grossSales - totalCost);
    netProfit = round2(grossProfit / (1 + gstRate/100));
  }

  const rate = (state.settings.incentiveRate ?? 5);
  let incentive = 0;
  let incentiveNote = '';
  if(isNonIncentiveRep(o.rep)){ incentiveNote = 'not eligible'; }
  else if(status === 'noteligible'){ incentiveNote = 'not eligible'; }
  else if(status === 'full'){
    if(netProfit === null){ incentiveNote = 'cost pending'; }
    else { incentive = round2(netProfit * rate / 100); }
  }
  const incMonth = o.incentiveMonth || o.ledgerMonth || '';
  return {...o, incMonth, grossSales, gstRate, totalCost, status, grossProfit, netProfit, incentive, incentiveNote};
}

function computedOrders(){ return state.orders.map(computeOrder); }

function fmtMoney(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?'−':'') + '₹' + v;
}
function fmtMoney2(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg?'−':'') + '₹' + v;
}
function repName(code){ return state.reps[code] || code || '—'; }
function chName(code){ return state.channels[code] || code || '—'; }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function statusPill(status){
  if(status==='full') return '<span class="pill pill-paid">Fully received</span>';
  if(status==='partial') return '<span class="pill pill-partial">Partially received</span>';
  return '<span class="pill pill-unpaid">Not received</span>';
}
const STATUS_LABELS = {full:'Payment received', partial:'Pending', none:'Pending', noteligible:'Not eligible'};

/* ============================================================
   PERSISTENCE
   ============================================================ */
/* Firestore (modular SDK). The module script at the bottom of the page sets
   window.fb = {db, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, query, limit}
   and calls startApp() once the user is signed in. */
/* Companies share users and the app; each has its own data under companies/{id}/.
   bizSplit: dashboard pies and the Incentives filter split Glass vs Lifting; without it they split by channel. */
const COMPANIES = [
  {id:'alfa',  name:'Alfa',  suffix:'Enterprises', bizSplit:true},
  {id:'muzaf', name:'Muzaf', suffix:'Enterprise'},
];
const LAST_COMPANY_KEY = 'ledger.company';
function readLastCompany(){
  let id = null;
  try{ id = localStorage.getItem(LAST_COMPANY_KEY); }catch(e){}
  return COMPANIES.some(c=>c.id===id) ? id : COMPANIES[0].id;
}
function rememberCompany(id){ try{ localStorage.setItem(LAST_COMPANY_KEY, id); }catch(e){} }
let currentCompany = readLastCompany();
const company = () => COMPANIES.find(c=>c.id===currentCompany);
const companyLabel = c => c.name + ' ' + c.suffix;

const colRef = name => fb.collection(fb.db, 'companies/'+currentCompany+'/'+name);
const docRef = path => fb.doc(fb.db, 'companies/'+currentCompany+'/'+path);
const userRef = uid => fb.doc(fb.db, 'users/'+uid);

async function startApp(user){
  db = (window.fb && fb.db) || null;

  if(!db){
    // no db capability available -> operate in-memory only, seed directly
    seedLocal();
    state.ready = true;
    render();
    return;
  }

  let meSnap = null;
  try{ meSnap = await fb.getDoc(userRef(user.uid)); }catch(e){ console.error('load user failed', e); }
  if(!meSnap || !meSnap.exists() || meSnap.data().active !== true){ showNoAccess(user.email); return; }
  state.me = {uid:user.uid, ...meSnap.data()};
  showCompanyBrand();
  if(!hasCompany(currentCompany)){
    const other = COMPANIES.find(c=>hasCompany(c.id));
    if(!other){ showNoAccess(user.email); return; }
    showNoAccess(user.email, other);
    return;
  }

  if(isAdmin()) await ensureSeeded();
  subscribeAll();
}

/* ============================================================
   USERS & TAB ACCESS
   users/{uid}: {email, name, role:'admin'|'user', access:{companyId:[page ids]}, active}
   Admins see every tab of every company. A user can open a company only if it
   has at least one tab ticked. firestore.rules enforces the same access for writes.
   ============================================================ */
function isAdmin(){ return !!state.me && state.me.role === 'admin'; }
function tabsFor(u, cid){ return ((u && u.access) || {})[cid] || []; }
function hasCompany(cid){ return isAdmin() || tabsFor(state.me, cid).length > 0; }
function canSee(pageId){
  if(!db) return true;
  const p = PAGES.find(x=>x.id===pageId);
  if(!p || !state.me) return false;
  if(isAdmin()) return true;
  return !p.adminOnly && tabsFor(state.me, currentCompany).includes(pageId);
}
function visiblePages(){ return PAGES.filter(p=>canSee(p.id)); }
function showNoAccess(email, other){
  document.getElementById('nav').innerHTML = '';
  document.getElementById('page').innerHTML = other
    ? `<div class="empty">The account <b>${escapeHtml(email)}</b> doesn't have access to ${escapeHtml(companyLabel(company()))}.<br><br><button class="btn btn-primary" id="go-other">Open ${escapeHtml(companyLabel(other))}</button></div>`
    : `<div class="empty">The account <b>${escapeHtml(email)}</b> doesn't have access to the ledger.<br>Ask the admin to add you or re-enable your account.</div>`;
  if(other) document.getElementById('go-other').addEventListener('click', ()=>switchCompany(other.id));
}
function showCompanyBrand(){
  const c = company();
  document.title = companyLabel(c) + ' — Sales & Incentive Ledger';
  document.querySelector('#brand .mark').textContent = c.name[0];
  document.querySelector('#brand .word').innerHTML = `${escapeHtml(c.name)}<em>·</em>${escapeHtml(c.suffix)}`;
  const sw = document.getElementById('btn-switch-company');
  if(sw) sw.hidden = !state.me || COMPANIES.filter(x=>hasCompany(x.id)).length < 2;
}
/* Reloading drops the previous company's live listeners and in-memory data. */
function switchCompany(id){ rememberCompany(id); location.reload(); }
function openCompanySwitcher(){
  closeAllOverlays();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.alignItems = 'center';
  overlay.innerHTML = `
    <div class="modal" style="max-width:340px;">
      <h2>Switch company</h2>
      <div class="settings-list">
        ${COMPANIES.filter(c=>hasCompany(c.id)).map(c=>`
          <button class="btn ${c.id===currentCompany?'btn-primary':''} co-pick" data-id="${c.id}" style="justify-content:flex-start;">${escapeHtml(companyLabel(c))}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelectorAll('.co-pick').forEach(b=>b.addEventListener('click', ()=>{
    if(b.dataset.id===currentCompany){ overlay.remove(); return; }
    switchCompany(b.dataset.id);
  }));
}
async function saveUser(uid, data){
  await fb.setDoc(userRef(uid), data, {merge:true});
}

function seedLocal(){
  state.orders = [];
  state.reps = {...DEFAULT_REP_NAMES};
  state.channels = {...DEFAULT_CHANNEL_NAMES};
  state.settings = {incentiveRate:5};
  state.months = ['2026-08'];
}

async function ensureSeeded(){
  // Sample data intentionally not auto-seeded — the ledger starts empty
  // and is populated by real entries added through the app.
  try{
    const repSnap = await fb.getDocs(fb.query(colRef('reps'), fb.limit(1)));
    if(repSnap.empty){
      for(const code of Object.keys(DEFAULT_REP_NAMES)){
        await fb.setDoc(docRef('reps/'+code), {code, name: DEFAULT_REP_NAMES[code]});
      }
    }
  }catch(e){ console.error('seed reps failed', e); }

  try{
    const chSnap = await fb.getDocs(fb.query(colRef('channels'), fb.limit(1)));
    if(chSnap.empty){
      for(const code of Object.keys(DEFAULT_CHANNEL_NAMES)){
        await fb.setDoc(docRef('channels/'+code), {code, name: DEFAULT_CHANNEL_NAMES[code]});
      }
    }
  }catch(e){ console.error('seed channels failed', e); }

  try{
    const s = await fb.getDoc(docRef('meta/settings'));
    if(!s.exists()){
      await fb.setDoc(docRef('meta/settings'), {incentiveRate:5});
    }
  }catch(e){ console.error('seed settings failed', e); }

  try{
    const mo = await fb.getDoc(docRef('meta/months'));
    if(!mo.exists()){
      await fb.setDoc(docRef('meta/months'), {list:['2026-08']});
    }
  }catch(e){ console.error('seed months failed', e); }
}

function subscribeAll(){
  fb.onSnapshot(colRef('orders'), snap=>{
    state.orders = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.ready = true;
    render();
  }, err=>{
    // Never show an empty ledger when loading failed: it looks like the data is gone.
    console.error(err);
    state.ready = false;
    renderNav();
    document.getElementById('page').innerHTML = `<div class="empty">Couldn't load ${escapeHtml(companyLabel(company()))}'s data${err.code==='permission-denied'?': this account isn\'t allowed to read it':''}.<br>Nothing has been deleted. Try reloading, or ask the admin.</div>`;
  });

  fb.onSnapshot(colRef('reps'), snap=>{
    const m = {};
    snap.docs.forEach(d=>{ const v=d.data(); m[v.code]=v.name; });
    state.reps = m;
    render();
  });

  fb.onSnapshot(colRef('channels'), snap=>{
    const m = {};
    snap.docs.forEach(d=>{ const v=d.data(); m[v.code]=v.name; });
    state.channels = m;
    render();
  });

  fb.onSnapshot(docRef('meta/settings'), snap=>{
    if(snap.exists()) state.settings = snap.data();
    render();
  });

  fb.onSnapshot(docRef('meta/expenses'), snap=>{
    if(snap.exists()) state.expenses = {...state.expenses, ...snap.data()};
    render();
  });

  fb.onSnapshot(docRef('meta/months'), snap=>{
    state.months = snap.exists() ? (snap.data().list||['2026-08']) : ['2026-08'];
    render();
  });

  // Own access record: tab changes by the admin apply live; disabling signs the user out of the data.
  fb.onSnapshot(userRef(state.me.uid), snap=>{
    if(!snap.exists() || snap.data().active !== true){ location.reload(); return; }
    state.me = {uid:state.me.uid, ...snap.data()};
    if(!hasCompany(currentCompany)){ location.reload(); return; }
    showCompanyBrand();
    subscribePurchasing();
    render();
  });
  subscribePurchasing();

  if(isAdmin()){
    fb.onSnapshot(fb.collection(fb.db, 'users'), snap=>{
      state.users = snap.docs.map(d=>({uid:d.id, ...d.data()}));
      render();
    });
  }
}

async function saveOrder(order){
  if(db){
    const id = order.id || ('ord_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
    const {id:_drop, ...body} = order;
    body.updatedAt = new Date().toISOString();
    if(!order.id) body.createdAt = new Date().toISOString();
    await fb.setDoc(docRef('orders/'+id), body);
  }else{
    if(order.id){
      const idx = state.orders.findIndex(o=>o.id===order.id);
      if(idx>-1) state.orders[idx] = order;
    }else{
      order.id = 'ord_'+Date.now();
      state.orders.push(order);
    }
    render();
  }
}
async function deleteOrderById(id){
  if(db){ await fb.deleteDoc(docRef('orders/'+id)); }
  else{ state.orders = state.orders.filter(o=>o.id!==id); render(); }
}
async function updateOrderField(id, patch){
  if(db){ await fb.updateDoc(docRef('orders/'+id), patch); }
  else{
    const idx = state.orders.findIndex(o=>o.id===id);
    if(idx>-1) state.orders[idx] = {...state.orders[idx], ...patch};
    render();
  }
}
async function saveRepName(code, name){
  if(db){ await fb.setDoc(docRef('reps/'+code), {code,name}); }
  else{ state.reps[code]=name; render(); }
}
async function saveChannelName(code, name){
  if(db){ await fb.setDoc(docRef('channels/'+code), {code,name}); }
  else{ state.channels[code]=name; render(); }
}
async function deleteRep(code){
  if(db){ await fb.deleteDoc(docRef('reps/'+code)); }
  else{ delete state.reps[code]; render(); }
}
async function deleteChannel(code){
  if(db){ await fb.deleteDoc(docRef('channels/'+code)); }
  else{ delete state.channels[code]; render(); }
}
async function saveExpenses(exp){
  if(db){ await fb.setDoc(docRef('meta/expenses'), exp); }
  else{ state.expenses = exp; render(); }
}
async function saveSettings(newSettings){
  if(db){ await fb.setDoc(docRef('meta/settings'), newSettings); }
  else{ state.settings = newSettings; render(); }
}
function allMonthTabs(){
  const set = new Set(state.months||[]);
  state.orders.forEach(o=>{ if(o.ledgerMonth) set.add(o.ledgerMonth); });
  return [...set].sort();
}
async function addMonthTab(month){
  const list = Array.from(new Set([...(state.months||[]), month])).sort();
  if(db){ await fb.setDoc(docRef('meta/months'), {list}); }
  else{ state.months = list; render(); }
}
/* Removing a month also deletes the orders filed under it (a tab can't exist
   without them, because allMonthTabs() derives tabs from orders as well). */
async function removeMonthTab(month){
  const ids = state.orders.filter(o=>o.ledgerMonth===month).map(o=>o.id);
  const list = (state.months||[]).filter(m=>m!==month);
  if(db){
    for(let i=0;i<ids.length;i+=20){
      await Promise.all(ids.slice(i,i+20).map(id=>fb.deleteDoc(docRef('orders/'+id))));
    }
    await fb.setDoc(docRef('meta/months'), {list});
  }else{
    state.orders = state.orders.filter(o=>o.ledgerMonth!==month);
    state.months = list;
    render();
  }
}
function currentMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
/* Indian financial year: Apr 1 – Mar 31 */
function fyStartYear(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return m>=4 ? y : y-1;
}
function fyLabel(startYear){
  return 'FY ' + String(startYear).slice(-2) + '-' + String(startYear+1).slice(-2);
}
function availableFYs(){
  const set = new Set(allMonthTabs().map(fyStartYear));
  return [...set].sort((a,b)=>b-a);
}
function monthsInFY(startYear){
  return allMonthTabs().filter(m=>fyStartYear(m)===startYear).sort();
}

   NAV
   ============================================================ */

  {id:'dashboard', label:'Dashboard', icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'},

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = visiblePages().map(p=>`
    <a data-page="${p.id}" class="${currentPage===p.id?'active':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${p.icon}"/></svg>
      ${p.label}
    </a>`).join('');
  nav.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click', ()=>{ currentPage = a.dataset.page; document.getElementById('sidebar').classList.remove('open'); render(); });
  });
}
function closeAllOverlays(){
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
}
function closeTopOverlay(){
  const overlays = document.querySelectorAll('.overlay');
  if(overlays.length && overlays[overlays.length-1].id !== 'login-overlay') overlays[overlays.length-1].remove();
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeTopOverlay();
});
document.getElementById('menu-btn').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  if(!canSee(currentPage)) currentPage = (visiblePages()[0]||{}).id;
  renderNav();
  const page = document.getElementById('page');
  if(!state.ready){ page.innerHTML = '<div class="empty">Loading ledger…</div>'; return; }
  Object.values(charts).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  charts = {};
  if(currentPage==='dashboard') renderDashboard(page);
  else if(currentPage==='orders') renderOrders(page);
  else if(currentPage==='pnl') renderPnl(page);
  else if(currentPage==='channels') renderChannels(page);
  else if(currentPage==='salesmen') renderSalesmen(page);
  else if(currentPage==='incentives') renderIncentives(page);
  else if(currentPage==='monthly') renderMonthly(page);
  else if(currentPage==='expenses') renderExpenses(page);
  else if(currentPage==='purchase') renderPurchase(page);
  else if(currentPage==='masters') renderMasters(page);
  else if(currentPage==='settings') renderSettings(page);
  else if(currentPage==='users') renderUsers(page);
  else page.innerHTML = '<div class="empty">No tabs have been assigned to your account yet. Ask the admin.</div>';
}

   DASHBOARD
   ============================================================ */
/* Business split: channel SR is the Lifting business; every other channel is Glass. */
function businessOf(channelCode){
  const c = String(channelCode||'').trim().toLowerCase();
  const n = String(state.channels[channelCode]||'').trim().toLowerCase();
  return (c==='sr' || n==='sr') ? 'Lifting' : 'Glass';
}
let dashboardFY = null;
function fyMonthKeys(startYear){
  const out=[];
  for(let i=0;i<12;i++){ const m=((3+i)%12)+1; const y=m>=4?startYear:startYear+1; out.push(y+'-'+String(m).padStart(2,'0')); }
  return out;
}
function renderDashboard(page){
  const fys = availableFYs();
  if(dashboardFY===null || (dashboardFY!=='all' && !fys.includes(dashboardFY))){
    dashboardFY = fys.includes(fyStartYear(currentMonthKey())) ? fyStartYear(currentMonthKey()) : (fys[0] ?? 'all');
  }
  const all = computedOrders();
  const orders = all.filter(o=> o.ledgerMonth && (dashboardFY==='all' || fyStartYear(o.ledgerMonth)===dashboardFY));
  const totalGross = round2(orders.reduce((s,o)=>s+o.grossSales,0));
  const known = orders.filter(o=>o.netProfit!==null);
  const totalGrossProfit = round2(known.reduce((s,o)=>s+o.grossProfit,0));
  const totalNet = round2(known.reduce((s,o)=>s+o.netProfit,0));
  const costPendingCount = orders.filter(o=>o.totalCost===null).length;
  const kGross = known.reduce((t,o)=>t+o.grossSales,0), kCost = known.reduce((t,o)=>t+o.totalCost,0);
  const avgMarkup = kCost>0 ? (kGross/kCost-1)*100 : null;
  const fyText = dashboardFY==='all' ? 'all years' : fyLabel(dashboardFY);
  const pieBy = company().bizSplit ? 'business' : 'channel';
  const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

  page.innerHTML = `
    <div class="pagehead">
      <div><h1>Dashboard</h1><p>Sales and profit for ${escapeHtml(fyText)} — ${orders.length} sale orders.</p></div>
      <div class="actions"><select id="dash-fy" style="width:auto;min-width:130px;">
        ${fys.map(y=>`<option value="${y}" ${dashboardFY===y?'selected':''}>${fyLabel(y)}</option>`).join('')}
        <option value="all" ${dashboardFY==='all'?'selected':''}>All years</option>
      </select></div>
    </div>
    <div class="kpi-row" style="grid-template-columns:repeat(4,1fr);">
      <div class="kpi"><div class="icon-chip">${icon('M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6')}</div><div class="label">Gross sales</div><div class="value num">${fmtMoney(totalGross)}</div><div class="sub">${orders.length} orders · incl. GST</div></div>
      <div class="kpi"><div class="icon-chip">${icon('M3 17l6-6 4 4 8-8M21 7v6M21 7h-6')}</div><div class="label">Gross profit</div><div class="value num ${totalGrossProfit>=0?'pos':'neg'}">${fmtMoney(totalGrossProfit)}</div><div class="sub">${costPendingCount? costPendingCount+' orders await cost entry':'incl. GST'}</div></div>
      <div class="kpi hero"><div class="icon-chip">${icon('M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z')}</div><div class="label">Net profit</div><div class="value num ${totalNet>=0?'pos':'neg'}">${fmtMoney(totalNet)}</div><div class="sub">GST-adjusted</div></div>
      <div class="kpi"><div class="icon-chip">${icon('M7 17L17 7M9 7h8v8')}</div><div class="label">Average profit markup</div><div class="value num">${avgMarkup===null?'—':avgMarkup.toFixed(1)+'%'}</div><div class="sub">gross sales ÷ cost − 1</div></div>
    </div>
    <div class="chart-row" style="grid-template-columns:1fr;">
      <div class="panel"><h3>Sales &amp; profit by month — ${escapeHtml(fyText)}</h3><div class="panel-chart tall"><canvas id="chTrend"></canvas></div></div>
    </div>
    <div class="chart-row">
      <div class="panel"><h3>Sales by channel — monthly</h3><div class="panel-chart tall"><canvas id="chChSales"></canvas></div></div>
      <div class="panel"><h3>Net profit by channel — monthly</h3><div class="panel-chart tall"><canvas id="chChProfit"></canvas></div></div>
    </div>
    <div class="chart-row">
      <div class="panel"><h3 class="share-title">Sales by ${pieBy}</h3><div class="panel-chart tall"><canvas id="chBizSales"></canvas></div></div>
      <div class="panel"><h3 class="share-title">Profit by ${pieBy}</h3><div class="panel-chart tall"><canvas id="chBizProfit"></canvas></div></div>
    </div>
  `;
  document.getElementById('dash-fy').addEventListener('change', e=>{ dashboardFY = e.target.value==='all' ? 'all' : parseInt(e.target.value,10); renderDashboard(page); });

  // month axis: 12 months of the FY, or every month with data for "all years"
  const months = dashboardFY==='all' ? [...new Set(orders.map(o=>o.ledgerMonth))].sort() : fyMonthKeys(dashboardFY);
  const mLabel = m => MONTH_NAMES[parseInt(m.split('-')[1],10)-1].slice(0,3)+' '+m.slice(2,4);
  const labels = months.map(mLabel);
  const sumBy = (list, fn) => months.map(m=>round2(list.filter(o=>o.ledgerMonth===m).reduce((t,o)=>t+fn(o),0)));
  const lastM = orders.reduce((m,o)=>o.ledgerMonth>m?o.ledgerMonth:m,'');
  const lineBy = (list, fn) => sumBy(list, fn).map((v,i)=> months[i]>lastM ? null : v);
  const axisOpts = (extra={}) => ({
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index', intersect:false},
    plugins:{legend:{display:true, position:'top', labels:{color:getSoftColor(), font:{family:'IBM Plex Sans', size:12}, boxWidth:12}}, tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+': '+fmtMoney(ctx.parsed.y)}}},
    scales:{
      x:{grid:{display:false}, ticks:{color:getSoftColor(), font:{family:'IBM Plex Sans', size:11}}, ...(extra.x||{})},
      y:{grid:{color:getGridColor()}, ticks:{color:getSoftColor(), font:{family:'IBM Plex Mono', size:10}, callback:v=>fmtMoney(v)}, ...(extra.y||{})}

  });

  // 1. trend: bars = gross sales, lines = gross & net profit
  charts.trend = new Chart(document.getElementById('chTrend'), {
    data:{labels, datasets:[
      {type:'bar', label:'Gross sales', data:sumBy(orders,o=>o.grossSales), backgroundColor:'#7FA7C9', borderRadius:3, maxBarThickness:38, order:3},
      {type:'line', label:'Gross profit', data:lineBy(known,o=>o.grossProfit), borderColor:'#1B8A8F', backgroundColor:'#1B8A8F', tension:.3, pointRadius:3, order:2},
      {type:'line', label:'Net profit', data:lineBy(known,o=>o.netProfit), borderColor:'#F59E0B', backgroundColor:'#F59E0B', tension:.3, pointRadius:3, order:1}
    ]},
    options:axisOpts()
  });

  // channels present in this view, biggest first
  const chTotals = {}; orders.forEach(o=>{ chTotals[o.channel]=(chTotals[o.channel]||0)+o.grossSales; });
  const chCodes = Object.keys(chTotals).sort((a,b)=>chTotals[b]-chTotals[a]);
  const col = i => SHARE_COLORS[i%SHARE_COLORS.length];

  // 2. channel sales per month: stacked bars
  charts.chSales = new Chart(document.getElementById('chChSales'), {
    type:'bar',
    data:{labels, datasets: chCodes.map((c,i)=>({label:chName(c), data:sumBy(orders.filter(o=>o.channel===c),o=>o.grossSales), backgroundColor:col(i), borderRadius:2, maxBarThickness:38}))},
    options:axisOpts({x:{stacked:true}, y:{stacked:true}})
  });
  // 3. channel profit per month: lines
  charts.chProfit = new Chart(document.getElementById('chChProfit'), {
    type:'line',
    data:{labels, datasets: chCodes.map((c,i)=>({label:chName(c), data:lineBy(known.filter(o=>o.channel===c),o=>o.netProfit), borderColor:col(i), backgroundColor:col(i), tension:.3, pointRadius:3}))},
    options:axisOpts()
  });
  // 4. share pies: by channel (same colours as the channel charts above), or Glass vs Lifting
  if(!company().bizSplit){
    const chNet = c => known.filter(o=>o.channel===c).reduce((t,o)=>t+o.netProfit,0);
    charts.bizSales = shareChart('chBizSales', chCodes.map(chName), chCodes.map(c=>chTotals[c]), false);
    charts.bizProfit = shareChart('chBizProfit', chCodes.map(chName), chCodes.map(chNet), false);
    return;
  }
  const biz = {Lifting:{gross:0,net:0}, Glass:{gross:0,net:0}};
  orders.forEach(o=>{ const b=biz[businessOf(o.channel)]; b.gross+=o.grossSales; if(o.netProfit!==null) b.net+=o.netProfit; });
  charts.bizSales = shareChart('chBizSales', ['Glass','Lifting'], [biz.Glass.gross, biz.Lifting.gross], false);
  charts.bizProfit = shareChart('chBizProfit', ['Glass','Lifting'], [biz.Glass.net, biz.Lifting.net], false);
}

function getAccentColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#A9772F'; }
function getInkColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#16231D'; }
function getGridColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--border-soft').trim() || '#eee'; }
function getSoftColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim() || '#555'; }
const PIE_COLORS = ['#1F5F8B','#1B8A8F','#64748B','#7FA7C9','#F59E0B'];
const SHARE_COLORS = ['#1F5F8B','#1B8A8F','#64748B','#7FA7C9','#F59E0B','#3B8EA5','#94A3B8','#2F4B66','#5FB3B3','#C7D2DE'];
const shareLabelsPlugin = {
  id:'shareLabels',
  afterDatasetsDraw(chart){
    const meta = chart.getDatasetMeta(0), data = chart.data.datasets[0].data;
    const tot = data.reduce((a,b)=>a+b,0); if(!tot) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.font = "700 13px 'IBM Plex Sans', sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
    meta.data.forEach((el,i)=>{
      const pct = data[i]/tot*100; if(pct < 1.5) return;
      const p = el.getProps(['x','y','startAngle','endAngle','innerRadius','outerRadius'], true);
      const ang = (p.startAngle+p.endAngle)/2, rad = (p.innerRadius+p.outerRadius)/2 * (p.innerRadius? 1 : 0.74);
      const x = p.x + Math.cos(ang)*rad, y = p.y + Math.sin(ang)*rad;
      const txt = Math.round(pct)+'%', w = ctx.measureText(txt).width+14, h = 24;
      ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=4; ctx.shadowOffsetY=2;
      ctx.fillStyle='#3a3a3a'; ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x-w/2, y-h/2, w, h, 3); else ctx.rect(x-w/2, y-h/2, w, h);
      ctx.fill();
      ctx.shadowColor='transparent'; ctx.fillStyle='#fff'; ctx.fillText(txt, x, y+1);
    });
    ctx.restore();
  }
};
function shareChart(canvasId, labels, values, doughnut){
  return new Chart(document.getElementById(canvasId), {
    type: doughnut ? 'doughnut' : 'pie',
    data:{labels, datasets:[{data:values.map(v=>Math.max(round2(v),0)), backgroundColor:labels.map((_,i)=>SHARE_COLORS[i%SHARE_COLORS.length]), borderWidth:0}]},
    options:{
      responsive:true, maintainAspectRatio:false, cutout: doughnut ? '48%' : 0,
      layout:{padding:8},
      plugins:{
        legend:{display:true, position:'right', labels:{color:getSoftColor(), font:{family:'IBM Plex Sans', size:14}, boxWidth:16, boxHeight:16, usePointStyle:true, pointStyle:'rect'}},
        tooltip:{callbacks:{label:(ctx)=>{
          const tot = ctx.dataset.data.reduce((a,b)=>a+b,0);
          return ctx.label+': '+fmtMoney(ctx.parsed)+' ('+(tot?(ctx.parsed/tot*100).toFixed(1):'0.0')+'%)';
        }}}
      }
    },
    plugins:[shareLabelsPlugin]
  });
}
function barOptions(){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>fmtMoney(ctx.parsed.y ?? ctx.parsed.x)}}},
    scales:{
      x:{grid:{display:false}, ticks:{color:getSoftColor(), font:{family:'IBM Plex Sans', size:11}}},
      y:{grid:{color:getGridColor()}, ticks:{color:getSoftColor(), font:{family:'IBM Plex Mono', size:10}, callback:v=>fmtMoney(v)}}
    }
  };
}

/* ============================================================
   ORDERS
   ============================================================ */
function orderNum(ref){
  const m = String(ref||'').match(/^(\d+)/);
  return m ? parseInt(m[1],10) : Number.MAX_SAFE_INTEGER;
}
let orderSortDir = 'asc';
function sortByOrderNum(rows){
  const dir = orderSortDir==='asc' ? 1 : -1;
  return rows.sort((a,b)=> dir*(orderNum(a.ref)-orderNum(b.ref)));
}
function sortToggleBtn(){
  return `<button class="btn btn-sm" id="btn-sort-order">Order # ${orderSortDir==='asc'?'<span class="sort-arrow">&#8593;</span>':'<span class="sort-arrow">&#8595;</span>'}</button>`;
}

let orderFilters = {q:'', channel:'', rep:'', status:'', month:'all'};

const orderSelected = new Set();
function renderOrders(page){
  const tabs = allMonthTabs();
  if(orderFilters.month !== 'all' && !tabs.includes(orderFilters.month)) orderFilters.month = 'all';
  const all = computedOrders();
  let rows = all.filter(o=>{
    if(orderFilters.month !== 'all' && o.ledgerMonth !== orderFilters.month) return false;
    if(orderFilters.channel && o.channel!==orderFilters.channel) return false;
    if(orderFilters.rep && o.rep!==orderFilters.rep) return false;
    if(orderFilters.status && o.status!==orderFilters.status) return false;
    if(orderFilters.q){
      const q = orderFilters.q.toLowerCase();
      if(!o.ref.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  rows = sortByOrderNum(rows);

  const channelOpts = Object.keys(state.channels).map(c=>`<option value="${c}" ${orderFilters.channel===c?'selected':''}>${escapeHtml(chName(c))}</option>`).join('');
  const repOpts = Object.keys(state.reps).map(c=>`<option value="${c}" ${orderFilters.rep===c?'selected':''}>${escapeHtml(repName(c))}</option>`).join('');

  page.innerHTML = `
    <div class="pagehead">
      <div><h1>Sale Orders</h1><p>Core order entry, organized by month. Profit lives in the P&amp;L tab.</p></div>
      <div class="actions">
        <button class="btn" id="btn-template">Download template</button>
        <button class="btn" id="btn-bulk">Bulk upload</button>
        <input type="file" id="bulk-file-input" accept=".xlsx,.xls,.csv" style="display:none;">
        <button class="btn btn-primary" id="btn-new-order">+ New order</button>
      </div>
    </div>
    <div class="month-tabs" id="month-tabs">
      <div class="month-tab ${orderFilters.month==='all'?'active':''}" data-month="all">All orders</div>
      ${tabs.map(m=>`<div class="month-tab ${orderFilters.month===m?'active':''}" data-month="${m}">${escapeHtml(monthLabel(m))}</div>`).join('')}
      <div class="month-tab-add" id="btn-add-month" title="Add a new month">+</div>
    </div>
    <div class="toolbar">
      <input type="search" id="f-q" placeholder="Search order ref…" value="${escapeHtml(orderFilters.q)}">
      <select id="f-channel"><option value="">All channels</option>${channelOpts}</select>
      <select id="f-rep"><option value="">All salesmen</option>${repOpts}</select>
      ${sortToggleBtn()}
      ${orderFilters.month!=='all' ? `<button class="btn btn-sm btn-danger" id="btn-remove-month">Remove ${escapeHtml(monthLabel(orderFilters.month))}</button>` : ''}
      <div class="spacer"></div>
      <span class="muted" style="font-size:12px;">${rows.length} of ${all.length} orders</span>
    </div>
    <div id="ord-bar" class="bulk-bar" style="display:none;">
      <span id="ord-bar-count"></span>
      <button class="btn btn-sm btn-danger" id="ord-bar-delete">Delete selected</button>
      <button class="btn btn-sm" id="ord-bar-clear">Clear</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:34px;"><input type="checkbox" id="ord-all" style="width:auto;" title="Select all in view"></th><th>Order ref</th><th>Channel</th><th>Salesman</th>
          <th class="num">Gross sales</th><th class="num">GST%</th><th class="num">Total cost</th><th class="num">Markup %</th><th></th>
        </tr></thead>
        <tbody>
        ${rows.map(o=>`
          <tr data-id="${o.id}" style="cursor:pointer;">
            <td class="sel-cell"><input type="checkbox" class="ord-sel" data-id="${o.id}" style="width:auto;" ${orderSelected.has(o.id)?'checked':''}></td>
            <td class="ref">${escapeHtml(o.ref)}<div class="sub">${escapeHtml(monthLabel(o.ledgerMonth))}</div></td>
            <td>${escapeHtml(chName(o.channel))}</td>
            <td>${escapeHtml(repName(o.rep))}</td>
            <td class="num">${fmtMoney(o.grossSales)}</td>
            <td class="num">${o.gstRate}%</td>
            <td class="num">${o.totalCost===null?'<span class="muted">pending</span>':fmtMoney(o.totalCost)}</td>
            <td class="num">${(o.totalCost===null||!o.totalCost)?'<span class="muted">—</span>':(((o.grossSales-o.totalCost)/o.totalCost*100).toFixed(1)+'%')}</td>
            <td><button class="icon-btn btn-del" data-id="${o.id}" title="Delete">✕</button></td>
          </tr>`).join('') || `<tr><td colspan="9" class="empty">No orders in ${orderFilters.month==='all'?'the ledger':'this month'} yet. Use "+ New order" to add one.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('btn-new-order').addEventListener('click', ()=>openOrderModal(null));
  document.getElementById('btn-template').addEventListener('click', ()=>downloadTemplate());
  document.getElementById('btn-bulk').addEventListener('click', ()=>document.getElementById('bulk-file-input').click());
  document.getElementById('bulk-file-input').addEventListener('change', handleBulkFile);
  document.getElementById('f-q').addEventListener('input', e=>{ orderFilters.q=e.target.value; renderOrders(page); const q=document.getElementById('f-q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); });
  document.getElementById('f-channel').addEventListener('change', e=>{ orderFilters.channel=e.target.value; renderOrders(page); });
  document.getElementById('f-rep').addEventListener('change', e=>{ orderFilters.rep=e.target.value; renderOrders(page); });
  document.getElementById('btn-sort-order').addEventListener('click', ()=>{ orderSortDir = orderSortDir==='asc'?'desc':'asc'; renderOrders(page); });
  page.querySelectorAll('.month-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ orderFilters.month = t.dataset.month; renderOrders(page); });
  });
  document.getElementById('btn-add-month').addEventListener('click', ()=>openAddMonthModal());
  const removeBtn = document.getElementById('btn-remove-month');
  if(removeBtn){
    removeBtn.addEventListener('click', ()=>{
      const month = orderFilters.month;
      const count = state.orders.filter(o=>o.ledgerMonth===month).length;
      const body = count
        ? `This also permanently deletes the ${count} order${count!==1?'s':''} filed under it. This cannot be undone.`
        : 'This month has no orders. The tab will be removed.';
      showConfirm(`Remove ${monthLabel(month)}?`, body, async ()=>{
        showToast('Removing ' + monthLabel(month) + '…');
        await removeMonthTab(month);
        orderFilters.month = 'all';
        render();
        showToast(monthLabel(month) + ' removed');
      });
    });
  }
  page.querySelectorAll('tbody tr[data-id]').forEach(tr=>{
    tr.addEventListener('click', (e)=>{
      if(e.target.closest('.btn-del') || e.target.closest('.sel-cell')) return;
      openOrderModal(tr.dataset.id);
    });
  });
  page.querySelectorAll('.btn-del').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = b.dataset.id;
      const ref = state.orders.find(o=>o.id===id)?.ref || 'this order';
      showConfirm(`Delete order "${ref}"?`, 'This removes it permanently — it cannot be undone.', async ()=>{
        await deleteOrderById(id);
        showToast('Order deleted');
      });
    });
  });
  // multi-select + bulk delete
  const rowIds = new Set(rows.map(o=>o.id));
  [...orderSelected].forEach(id=>{ if(!rowIds.has(id)) orderSelected.delete(id); });
  const ordBar = document.getElementById('ord-bar'), ordAll = document.getElementById('ord-all');
  const refreshOrdBar = () => {
    ordBar.style.display = orderSelected.size ? 'flex' : 'none';
    document.getElementById('ord-bar-count').textContent = orderSelected.size + ' selected';
    ordAll.checked = rows.length>0 && orderSelected.size===rows.length;
    ordAll.indeterminate = orderSelected.size>0 && orderSelected.size<rows.length;
  };
  page.querySelectorAll('.ord-sel').forEach(cb=>{
    cb.addEventListener('change', ()=>{ cb.checked ? orderSelected.add(cb.dataset.id) : orderSelected.delete(cb.dataset.id); refreshOrdBar(); });
  });
  ordAll.addEventListener('change', ()=>{
    if(ordAll.checked) rows.forEach(o=>orderSelected.add(o.id)); else orderSelected.clear();
    page.querySelectorAll('.ord-sel').forEach(cb=>{ cb.checked = orderSelected.has(cb.dataset.id); });
    refreshOrdBar();
  });
  document.getElementById('ord-bar-clear').addEventListener('click', ()=>{
    orderSelected.clear();
    page.querySelectorAll('.ord-sel').forEach(cb=>{ cb.checked=false; });
    refreshOrdBar();
  });
  document.getElementById('ord-bar-delete').addEventListener('click', ()=>{
    const ids = [...orderSelected];
    if(!ids.length) return;
    showConfirm(`Delete ${ids.length} order${ids.length!==1?'s':''}?`, 'This removes them permanently — it cannot be undone.', async ()=>{
      if(db){
        for(let i=0;i<ids.length;i+=20){
          await Promise.all(ids.slice(i,i+20).map(id=>fb.deleteDoc(docRef('orders/'+id))));
        }
      }else{
        state.orders = state.orders.filter(o=>!orderSelected.has(o.id));
      }
      orderSelected.clear();
      showToast('Deleted '+ids.length+' order'+(ids.length!==1?'s':''));
      if(!db) render();
    });
  });
  refreshOrdBar();
}

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.alignItems = 'center';
  const defaultVal = currentMonthKey();
  overlay.innerHTML = `

function excelSerialToDate(serial){
  const utc_days = Math.floor(serial - 25569);
  const utc_value = utc_days * 86400;
  return new Date(utc_value * 1000);
}
function toISODate(v){
  // v is a raw Excel serial number for real date cells (cellDates is intentionally
  // NOT used on read — SheetJS's Date-object conversion applies the browser's local
  // timezone plus floating-point rounding, which can shift a date across midnight,
  // e.g. reading April 1 back as March 31 for a viewer in IST). Pure day-count
  // arithmetic here is timezone-independent.
  if(typeof v === 'number' && isFinite(v)) return excelSerialToDate(v).toISOString().slice(0,10);
  if(v instanceof Date && !isNaN(v)){
    const y=v.getUTCFullYear(), m=v.getUTCMonth()+1, d=v.getUTCDate();
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  const s = String(v||'').trim();
  if(!s) return '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return '';
}
const MONTH_ABBR = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
/* Reads a Month cell: YYYY-MM, an Excel date (Excel turns a typed 2026-04 into a
   date), a bare month number 1-12, or a month name ("Apr", "April 2026").
   A month with no year is read as that month of the current financial year
   (Apr-Mar) and flagged so the upload preview can say so. */
function parseMonthCell(v){
  const blank = {key:'', assumed:false, blank:true};
  if(v===''||v===null||v===undefined) return blank;
  const pad = n => String(n).padStart(2,'0');
  const fyStart = fyStartYear(currentMonthKey());
  const assumeYear = m => ({key:(m>=4 ? fyStart : fyStart+1) + '-' + pad(m), assumed:true});
  const bad = {key:'', assumed:false};
  if(typeof v === 'number' && isFinite(v)){
    if(Number.isInteger(v) && v>=1 && v<=12) return assumeYear(v);
    if(v<20000) return bad; // not a month number and too small to be a real date serial
    const iso = toISODate(v);
    return iso ? {key:iso.slice(0,7), assumed:false} : bad;
  }
  if(v instanceof Date && !isNaN(v)){
    const iso = toISODate(v);
    return iso ? {key:iso.slice(0,7), assumed:false} : bad;
  }
  const s = String(v).trim();
  if(!s) return blank;
  let m = s.match(/^(\d{4})[-\/](\d{1,2})$/);
  if(m) return (+m[2]>=1 && +m[2]<=12) ? {key:m[1]+'-'+pad(m[2]), assumed:false} : bad;
  m = s.match(/^(\d{1,2})$/);
  if(m) return (+m[1]>=1 && +m[1]<=12) ? assumeYear(+m[1]) : bad;
  m = s.match(/^([A-Za-z]{3,9})\.?[\s\-\/,]*(\d{2}|\d{4})?$/);
  if(m){
    const idx = MONTH_ABBR.indexOf(m[1].slice(0,3).toLowerCase());
    if(idx>=0){
      if(m[2]){ const y = m[2].length===2 ? 2000+(+m[2]) : +m[2]; return {key:y+'-'+pad(idx+1), assumed:false}; }
      return assumeYear(idx+1);
    }
  }
  const iso = toISODate(s);
  return iso ? {key:iso.slice(0,7), assumed:false} : bad;
}
function normHeader(h){ return String(h||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function resolveField(n){
  if(n.includes('orderref')) return 'ref';
  if(n.includes('channel')) return 'channel';
  if(n.includes('salesman')||n.includes('salesperson')||n==='rep') return 'rep';
  if(n.includes('belongstomonth')||(n.includes('month')&&!n.includes('date'))) return 'ledgerMonth';
  if(n.includes('orderdate')||n==='date') return 'date';
  if(n.includes('grosssales')) return 'grossSales';
  if(n.includes('totalcost')) return 'totalCost';
  if(n.includes('gst')) return 'gstRate';
  if(n.includes('notes')) return 'notes';
  return null;
}
function resolveCode(value, dict){
  const v = String(value).trim();
  const codeMatch = Object.keys(dict).find(c=>c.toLowerCase()===v.toLowerCase());
  if(codeMatch) return codeMatch;
  const nameMatch = Object.keys(dict).find(c=>String(dict[c]).toLowerCase()===v.toLowerCase());
  if(nameMatch) return nameMatch;
  return v;
}
const TEMPLATE_EXAMPLE_REF = '200-IM-1509-26-A-Example Client';

function parseWorkbookRows(wb){
  const sheetName = wb.SheetNames.find(n=>n.toLowerCase().includes('sale order')) || wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true, blankrows:false});
  const valid=[], errors=[], newChannels=new Set(), newReps=new Set(), newMonths=new Set();
  const monthCounts = {};
  let assumedCount = 0;
  const assumedFY = fyLabel(fyStartYear(currentMonthKey()));
  if(!aoa.length) return {valid, errors:[{row:0, ref:'', reason:'Sheet is empty'}], newChannels, newReps, newMonths, monthCounts, assumedCount, assumedFY};

  const colMap = {};
  aoa[0].forEach((h,idx)=>{ const f = resolveField(normHeader(h)); if(f && colMap[f]===undefined) colMap[f]=idx; });
  const existingTabs = allMonthTabs();

  for(let r=1;r<aoa.length;r++){
    const row = aoa[r];
    const get = f => colMap[f]!==undefined ? row[colMap[f]] : '';
    const ref = String(get('ref')||'').trim();
    if(!ref) continue;
    if(ref === TEMPLATE_EXAMPLE_REF) continue;

    const channelRaw = String(get('channel')||'').trim();
    const repRaw = String(get('rep')||'').trim();
    const grossRaw = get('grossSales');
    const dateRaw = get('date');
    const monthRaw = get('ledgerMonth');
    const gstRaw = get('gstRate');
    const costRaw = get('totalCost');
    const notes = String(get('notes')||'').trim();

    const rowErrors = [];
    if(!channelRaw) rowErrors.push('missing Channel');
    if(!repRaw) rowErrors.push('missing Salesman');
    const grossSales = parseFloat(grossRaw);
    if(grossRaw==='' || isNaN(grossSales)) rowErrors.push('missing/invalid Gross Sales');
    // Month is the required field. Files from the older template (with an Order Date
    // column) still work: a blank Month falls back to the date's month.
    const monthParsed = parseMonthCell(monthRaw);
    let ledgerMonth = monthParsed.key;
    if(!ledgerMonth && monthParsed.blank){
      const iso = toISODate(dateRaw);
      if(iso) ledgerMonth = iso.slice(0,7);
    }
    if(!ledgerMonth) rowErrors.push(monthParsed.blank ? 'missing Month' : 'invalid Month');

    if(rowErrors.length){ errors.push({row:r+1, ref, reason:rowErrors.join(', ')}); continue; }

    if(monthParsed.assumed) assumedCount++;
    monthCounts[ledgerMonth] = (monthCounts[ledgerMonth]||0) + 1;
    const gstRate = (gstRaw===''||gstRaw===null||isNaN(parseFloat(gstRaw))) ? 0 : parseFloat(gstRaw);
    const totalCost = (costRaw===''||costRaw===null||costRaw===undefined||isNaN(parseFloat(costRaw))) ? null : parseFloat(costRaw);
    const channelCode = resolveCode(channelRaw, state.channels);
    const repCode = resolveCode(repRaw, state.reps);
    if(!state.channels[channelCode]) newChannels.add(channelCode);
    if(!state.reps[repCode]) newReps.add(repCode);
    if(!existingTabs.includes(ledgerMonth) && !newMonths.has(ledgerMonth)) newMonths.add(ledgerMonth);

    valid.push({ref, channel:channelCode, rep:repCode, ledgerMonth, gstRate, grossSales, totalCost, paymentStatus:'none', notes});
  }
  return {valid, errors, newChannels, newReps, newMonths, monthCounts, assumedCount, assumedFY};
}

async function handleBulkFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const parsed = parseWorkbookRows(wb);
    openBulkPreviewModal(parsed);
  }catch(err){
    console.error(err);
    showToast('Could not read that file — check it matches the template format');
  }
}

async function performBulkImport(parsed){
  for(const code of parsed.newChannels){ await saveChannelName(code, code); }
  for(const code of parsed.newReps){ await saveRepName(code, code); }

function buildTemplateWorkbook(){
  const headers = ['Order Ref*','Channel*','Salesman*','Month* (YYYY-MM or 1-12)','GST % (optional, blank = 0)','Gross Sales incl. GST*','Total Cost incl. GST (optional)','Notes (optional)'];
  const example = [TEMPLATE_EXAMPLE_REF,'IM','A','2026-09',18,125000,98000,'Sample row — delete before uploading'];
  const ws = XLSX.utils.aoa_to_sheet([headers, example]);
  ws['!cols'] = [{wch:30},{wch:12},{wch:12},{wch:24},{wch:14},{wch:18},{wch:20},{wch:24}];
  const chCodes = Object.keys(state.channels), rpCodes = Object.keys(state.reps);
  const refAoa = [['Channel code','Channel name','','Salesman code','Salesman name']];
  for(let i=0;i<Math.max(chCodes.length,rpCodes.length);i++){
    refAoa.push([chCodes[i]||'', chCodes[i]?state.channels[chCodes[i]]:'', '', rpCodes[i]||'', rpCodes[i]?state.reps[rpCodes[i]]:'']);
  }
  const refWs = XLSX.utils.aoa_to_sheet(refAoa);
  refWs['!cols'] = [{wch:14},{wch:16},{wch:2},{wch:14},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sale Orders');
  XLSX.utils.book_append_sheet(wb, refWs, 'Reference');
  return wb;
}
async function downloadTemplate(){
  const wb = buildTemplateWorkbook();
  const arr = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([arr], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  downloadBlob(blob, companyLabel(company()).replace(/\s+/g,'-') + '-Sale-Orders-Template.xlsx');
  showToast('Template ready');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

            <td>${escapeHtml(repName(o.rep))}</td>
            <td class="num">${fmtMoney(o.grossSales)}</td>
            <td class="num">${o.gstRate}%</td>
            <td class="num">${o.totalCost===null?'<span class="muted">pending</span>':fmtMoney(o.totalCost)}</td>
            <td class="num">${o.grossProfit===null?'—':fmtMoney(o.grossProfit)}</td>
            <td class="num">${o.netProfit===null?'—':fmtMoney(o.netProfit)}</td>
          </tr>`).join('') || `<tr><td colspan="8" class="empty">No orders in ${orderFilters.month==='all'?'the ledger':'this month'} yet — add them from the Sale Orders tab first.</td></tr>`}
        </tbody>
        ${rows.length ? `<tfoot><tr class="tot-row">
          <td colspan="3">Total · ${rows.length} order${rows.length!==1?'s':''}</td>
          <td class="num">${fmtMoney(pTotGross)}</td><td></td>
          <td class="num">${fmtMoney(pTotCost)}</td>
          <td class="num">${fmtMoney(pTotGP)}</td>
          <td class="num">${fmtMoney(pTotNP)}</td>
        </tr></tfoot>` : ''}
      </table>
    </div>
  `;

  document.getElementById('f-q').addEventListener('input', e=>{ orderFilters.q=e.target.value; renderPnl(page); const q=document.getElementById('f-q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); });
  document.getElementById('f-channel').addEventListener('change', e=>{ orderFilters.channel=e.target.value; renderPnl(page); });
  document.getElementById('f-rep').addEventListener('change', e=>{ orderFilters.rep=e.target.value; renderPnl(page); });
  document.getElementById('btn-sort-order').addEventListener('click', ()=>{ orderSortDir = orderSortDir==='asc'?'desc':'asc'; renderPnl(page); });
  page.querySelectorAll('.month-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ orderFilters.month = t.dataset.month; renderPnl(page); });
  });
}

/* ============================================================
   CHANNEL SUMMARY
   ============================================================ */
let channelFY = 'all';
let channelMonth = 'all';
function renderChannels(page){
  const fys = availableFYs();
  const monthsForFY = channelFY==='all' ? allMonthTabs() : monthsInFY(parseInt(channelFY,10));
  if(channelMonth!=='all' && !monthsForFY.includes(channelMonth)) channelMonth = 'all';

  const orders = computedOrders().filter(o=>{
    if(!o.ledgerMonth) return false;
    if(channelFY!=='all' && fyStartYear(o.ledgerMonth)!==parseInt(channelFY,10)) return false;
    if(channelMonth!=='all' && o.ledgerMonth!==channelMonth) return false;
    return true;
  });
  const groups = {};
  orders.forEach(o=>{
    const k = o.channel;
    if(!groups[k]) groups[k] = {channel:k, count:0, gross:0, net:0, netKnown:0, pending:0, incentive:0};
    const g = groups[k];
    g.count++;
    g.gross += o.grossSales;
    if(o.netProfit!==null){ g.net += o.netProfit; g.netKnown++; }
    if(o.status!=='full') g.pending += o.grossSales;
    g.incentive += o.incentive;
  });
  const rows = Object.values(groups).sort((a,b)=>b.gross-a.gross);
  const totalGross = rows.reduce((s,r)=>s+r.gross,0);

  page.innerHTML = `
    <div class="pagehead"><div><h1>Channel Summary</h1><p>Sales and profitability rolled up by sales channel.</p></div></div>
    <div class="toolbar">
      <select id="f-fy"><option value="all">All years</option>${fys.map(y=>`<option value="${y}" ${channelFY==String(y)?'selected':''}>${fyLabel(y)}</option>`).join('')}</select>
      <select id="f-month"><option value="all">All months</option>${monthsForFY.map(m=>`<option value="${m}" ${channelMonth===m?'selected':''}>${escapeHtml(monthLabel(m))}</option>`).join('')}</select>
      <div class="spacer"></div>
      <span class="muted" style="font-size:12px;">${orders.length} orders in view</span>
    </div>
    <div class="chart-row">
      <div class="panel"><h3 class="share-title">Sales - channel wise</h3><div class="panel-chart tall"><canvas id="chChannelShare"></canvas></div></div>
      <div class="panel"><h3 class="share-title">Profit - channel wise</h3><div class="panel-chart tall"><canvas id="chChannelProfit"></canvas></div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Channel</th><th class="num">Orders</th><th class="num">Gross sales</th><th class="num">% of total</th><th class="num">Net profit</th></tr></thead>
        <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${escapeHtml(chName(r.channel))}</td>
            <td class="num">${r.count}</td>
            <td class="num">${fmtMoney(r.gross)}</td>
            <td class="num">${totalGross?((r.gross/totalGross)*100).toFixed(1):'0.0'}%</td>
            <td class="num">${r.netKnown? fmtMoney(round2(r.net)) : '—'}</td>
          </tr>`).join('') || `<tr><td colspan="5" class="empty">No orders in this period.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('f-fy').addEventListener('change', e=>{ channelFY=e.target.value; channelMonth='all'; renderChannels(page); });
  document.getElementById('f-month').addEventListener('change', e=>{ channelMonth=e.target.value; renderChannels(page); });
  charts.channelShare = shareChart('chChannelShare', rows.map(r=>chName(r.channel)), rows.map(r=>r.gross), false);
  charts.channelProfit = shareChart('chChannelProfit', rows.map(r=>chName(r.channel)), rows.map(r=>r.net), true);
}

        <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${escapeHtml(repName(r.rep))}</td>
            <td class="num">${r.count}</td>

  document.getElementById('f-fy').addEventListener('change', e=>{ salesmenFY=e.target.value; salesmenMonth='all'; renderSalesmen(page); });

  charts.repBar = shareChart('chRepBar', rows.map(r=>repName(r.rep)), rows.map(r=>r.gross), false);
  charts.repProfit = shareChart('chRepProfit', rows.map(r=>repName(r.rep)), rows.map(r=>r.net), true);
