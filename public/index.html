/* ============================================================
   INCENTIVES
   ============================================================ */
let incentiveMonth = null;
let incentiveRep = 'all';
let incentiveChannel = '';
const incSelected = new Set();
function nextMonthKey(m){
  const [y,mm] = m.split('-').map(Number);
  return mm===12 ? (y+1)+'-01' : y+'-'+String(mm+1).padStart(2,'0');
}
function incentiveTabs(){
  const set = new Set(allMonthTabs());
  state.orders.forEach(o=>{ if(o.incentiveMonth) set.add(o.incentiveMonth); });
  return [...set].sort();
}
function renderIncentives(page){
  const tabs = incentiveTabs();
  if(incentiveMonth === null) incentiveMonth = tabs.length ? tabs[tabs.length-1] : 'all';
  if(incentiveMonth !== 'all' && !tabs.includes(incentiveMonth)) incentiveMonth = 'all';
  const rate = state.settings.incentiveRate ?? 5;
  const allOrders = computedOrders();
  const eligibleOrders = allOrders.filter(o=>!isNonIncentiveRep(o.rep));
  const monthOrders = incentiveMonth==='all' ? eligibleOrders : eligibleOrders.filter(o=>o.incMonth===incentiveMonth);

  const repCodes = [...new Set(monthOrders.map(o=>o.rep))].sort((a,b)=>repName(a).localeCompare(repName(b)));
  if(incentiveRep !== 'all' && !repCodes.includes(incentiveRep)) incentiveRep = 'all';
  const repOrders = incentiveRep==='all' ? monthOrders : monthOrders.filter(o=>o.rep===incentiveRep);
  // filter by business (Glass / Lifting) where the company has that split, else by channel
  const bizSplit = !!company().bizSplit;
  const filterKey = o => bizSplit ? businessOf(o.channel) : o.channel;
  const chCodes = bizSplit ? ['Glass','Lifting'].filter(b=>repOrders.some(o=>filterKey(o)===b)) : [...new Set(repOrders.map(o=>o.channel))];
  if(incentiveChannel && !chCodes.includes(incentiveChannel)) incentiveChannel = '';
  const orders = (incentiveChannel ? repOrders.filter(o=>filterKey(o)===incentiveChannel) : repOrders)
    .slice().sort((a,b)=>orderNum(a.ref)-orderNum(b.ref));

  const issued = orders.filter(o=>o.status==='full');
  const grand = round2(issued.reduce((s,o)=>s+o.incentive,0));
  const noCost = issued.filter(o=>o.netProfit===null);
  const carriedIn = orders.filter(o=>o.incentiveMonth && o.incentiveMonth!==o.ledgerMonth).length;
  const prevMonthKey = m => { const [y,mm]=m.split('-').map(Number); return mm===1 ? (y-1)+'-12' : y+'-'+String(mm-1).padStart(2,'0'); };
  const isLocked = o => o.status==='full' && o.incentiveLocked!==false;
  const statusSel = o => {
    const locked = isLocked(o);
    const isCarried = !!(o.incentiveMonth && o.incentiveMonth!==o.ledgerMonth);
    const lockBtn = o.status==='full'
      ? `<button class="icon-btn inc-lock ${locked?'locked':''}" data-id="${o.id}" title="${locked?'Locked — click to unlock':'Unlocked — click to lock'}">${locked
          ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>'
          : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.5-2"/></svg>'}</button>`
      : '';
    return `<div class="status-cell"><select class="inc-status" data-id="${o.id}" ${locked?'disabled':''}>
      <option value="none" ${o.status!=='full' && o.status!=='noteligible'?'selected':''}>Pending</option>
      <option value="full" ${o.status==='full'?'selected':''}>Payment received · issue incentive</option>
      <option value="noteligible" ${o.status==='noteligible'?'selected':''}>Not eligible</option>
      <option value="carry">Carry over to ${escapeHtml(monthLabel(nextMonthKey(o.incMonth||o.ledgerMonth)))}</option>
      ${isCarried ? `<option value="back">Push back to ${escapeHtml(monthLabel(prevMonthKey(o.incMonth)))}</option>` : ''}
    </select>${lockBtn}</div>`;
  };
  const totGross = round2(orders.reduce((t,o)=>t+o.grossSales,0));
  const totNet = round2(orders.reduce((t,o)=>t+(o.netProfit||0),0));
  const bulkable = orders.filter(o=>o.status!=='noteligible' && !isLocked(o));

  page.innerHTML = `
    <div class="pagehead">
      <div><h1>Incentives</h1><p>${rate}% of net profit (owners excluded). Mark an order "Payment received" to issue its incentive in that month, or carry it over to the next month.</p></div>
      <div class="actions"><button class="btn" id="btn-export">Export CSV</button></div>
    </div>
    <div class="month-tabs" id="month-tabs">
      <div class="month-tab ${incentiveMonth==='all'?'active':''}" data-month="all">All months</div>
      ${tabs.map(m=>`<div class="month-tab ${incentiveMonth===m?'active':''}" data-month="${m}">${escapeHtml(monthLabel(m))}</div>`).join('')}
    </div>
    <div class="month-tabs" id="rep-tabs">
      <div class="month-tab ${incentiveRep==='all'?'active':''}" data-rep="all">All salesmen</div>
      ${repCodes.map(r=>`<div class="month-tab ${incentiveRep===r?'active':''}" data-rep="${escapeAttr(r)}">${escapeHtml(repName(r))}</div>`).join('')}
    </div>
    <div class="toolbar">
      <select id="f-inc-channel"><option value="">${bizSplit?'All businesses':'All channels'}</option>${chCodes.map(c=>`<option value="${escapeAttr(c)}" ${incentiveChannel===c?'selected':''}>${escapeHtml(bizSplit?c:chName(c))}</option>`).join('')}</select>
      <div class="spacer"></div>
      ${incentiveMonth!=='all' && bulkable.length ? `<button class="btn btn-sm btn-danger" id="btn-bulk-ne">Mark all ${bulkable.length} as not eligible</button>` : ''}
      <span class="muted" style="font-size:12px;">${orders.length} order${orders.length!==1?'s':''} in view${carriedIn?` · ${carriedIn} carried over`:''}</span>
    </div>
    <div id="inc-bar" class="bulk-bar" style="display:none;">
      <span id="inc-bar-count"></span>
      <select id="inc-bar-action" style="width:auto;min-width:230px;">
        <option value="none">Set to Pending</option>
        <option value="full">Set to Payment received · issue incentive</option>
        <option value="noteligible">Set to Not eligible</option>
        <option value="carry">Carry over to next month</option>
        <option value="back">Push back to previous month</option>
      </select>
      <button class="btn btn-primary btn-sm" id="inc-bar-apply">Apply to selected</button>
      <button class="btn btn-sm" id="inc-bar-clear">Clear</button>
    </div>
    ${noCost.length? `<div class="section-note">${noCost.length} order${noCost.length>1?'s are':' is'} marked received but still missing a total cost, so incentive can't be computed. Add the cost in Sale Orders.</div>` : ''}
    <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi hero"><div class="label">Incentive issued</div><div class="value num accent">${fmtMoney2(grand)}</div></div>
      <div class="kpi"><div class="label">Orders issued</div><div class="value num">${issued.length}</div><div class="sub">of ${orders.length} in view</div></div>
      <div class="kpi"><div class="label">Total net profit in view</div><div class="value num">${fmtMoney(totNet)}</div><div class="sub">gross sales ${fmtMoney(totGross)}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width:34px;"><input type="checkbox" id="inc-all" style="width:auto;" title="Select all in view"></th><th>Order ref</th><th>Salesman</th><th>Channel</th><th class="num">Gross sales</th><th class="num">Net profit</th><th class="num">Incentive (${rate}%)</th><th>Status</th></tr></thead>
        <tbody>
        ${orders.map(o=>`
          <tr>
            <td><input type="checkbox" class="inc-sel" data-id="${o.id}" style="width:auto;" ${incSelected.has(o.id)?'checked':''}></td>
            <td class="ref">${escapeHtml(o.ref)}<div class="sub">${escapeHtml(monthLabel(o.ledgerMonth))}${o.incentiveMonth && o.incentiveMonth!==o.ledgerMonth?' · carried over':''}</div></td>
            <td>${escapeHtml(repName(o.rep))}</td>
            <td>${escapeHtml(chName(o.channel))}</td>
            <td class="num">${fmtMoney(o.grossSales)}</td>
            <td class="num">${o.netProfit===null?'—':fmtMoney(o.netProfit)}</td>
            <td class="num" style="color:var(--accent-ink);font-weight:600;">${o.status==='full' ? (o.incentive>0?fmtMoney2(o.incentive):(o.incentiveNote||'—')) : '—'}</td>
            <td>${statusSel(o)}</td>
          </tr>`).join('') || `<tr><td colspan="8" class="empty">No orders for this selection.</td></tr>`}
        </tbody>
        ${orders.length ? `<tfoot><tr class="tot-row">
          <td colspan="4">Total · ${orders.length} order${orders.length!==1?'s':''}</td>
          <td class="num">${fmtMoney(totGross)}</td>
          <td class="num">${fmtMoney(totNet)}</td>
          <td class="num">${fmtMoney2(grand)}</td>
          <td></td>
        </tr></tfoot>` : ''}
      </table>
    </div>
  `;

  page.querySelectorAll('#month-tabs .month-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ incentiveMonth = t.dataset.month; renderIncentives(page); });
  });
  page.querySelectorAll('#rep-tabs .month-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ incentiveRep = t.dataset.rep; incentiveChannel=''; renderIncentives(page); });
  });
  document.getElementById('f-inc-channel').addEventListener('change', e=>{ incentiveChannel = e.target.value; renderIncentives(page); });
  const patchFor = (o, value) => {
    if(value==='back'){
      if(!(o.incentiveMonth && o.incentiveMonth!==o.ledgerMonth)) return null;
      const prev = prevMonthKey(o.incMonth);
      return {incentiveMonth: prev===o.ledgerMonth ? null : prev, paymentStatus:'none', incentiveLocked:false};
    }
    if(value==='carry') return {incentiveMonth: nextMonthKey(o.incMonth||o.ledgerMonth), paymentStatus:'none', incentiveLocked:false};
    if(value==='noteligible') return {paymentStatus:'noteligible', incentiveLocked:false};
    if(value==='full') return {paymentStatus:'full', incentiveLocked:true};
    return {paymentStatus:'none', incentiveLocked:false};
  };
  page.querySelectorAll('.inc-status').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const o = allOrders.find(x=>x.id===sel.dataset.id);
      if(!o) return;
      if(isLocked(o)){ showToast('Locked — unlock first'); renderIncentives(page); return; }
      const patch = patchFor(o, sel.value);
      if(!patch){ renderIncentives(page); return; }
      await updateOrderField(o.id, patch);
      showToast(sel.value==='full' ? 'Incentive issued and locked' : sel.value==='carry' ? 'Carried over to ' + monthLabel(patch.incentiveMonth) : sel.value==='back' ? 'Pushed back' : sel.value==='noteligible' ? 'Marked not eligible' : 'Marked pending');
    });
  });

  // multi-select + bulk status change
  const visibleIds = new Set(orders.map(o=>o.id));
  [...incSelected].forEach(id=>{ if(!visibleIds.has(id)) incSelected.delete(id); });
  const bar = document.getElementById('inc-bar'), allBox = document.getElementById('inc-all');
  const refreshBar = () => {
    bar.style.display = incSelected.size ? 'flex' : 'none';
    document.getElementById('inc-bar-count').textContent = incSelected.size + ' selected';
    allBox.checked = orders.length>0 && incSelected.size===orders.length;
    allBox.indeterminate = incSelected.size>0 && incSelected.size<orders.length;
  };
  page.querySelectorAll('.inc-sel').forEach(cb=>{
    cb.addEventListener('change', ()=>{ cb.checked ? incSelected.add(cb.dataset.id) : incSelected.delete(cb.dataset.id); refreshBar(); });
  });
  allBox.addEventListener('change', ()=>{
    if(allBox.checked) orders.forEach(o=>incSelected.add(o.id)); else incSelected.clear();
    page.querySelectorAll('.inc-sel').forEach(cb=>{ cb.checked = incSelected.has(cb.dataset.id); });
    refreshBar();
  });
  document.getElementById('inc-bar-clear').addEventListener('click', ()=>{
    incSelected.clear();
    page.querySelectorAll('.inc-sel').forEach(cb=>{ cb.checked=false; });
    refreshBar();
  });
  document.getElementById('inc-bar-apply').addEventListener('click', ()=>{
    const value = document.getElementById('inc-bar-action').value;
    const label = document.querySelector('#inc-bar-action option:checked').textContent;
    const picked = orders.filter(o=>incSelected.has(o.id));
    const locked = picked.filter(isLocked);
    const todo = picked.filter(o=>!isLocked(o) && patchFor(o,value));
    if(!todo.length){ showToast(locked.length ? 'All selected orders are locked — unlock them first' : 'Nothing to change for this action'); return; }
    const skipped = picked.length - todo.length;
    showConfirm('Apply to '+todo.length+' order'+(todo.length!==1?'s':'')+'?',
      label + '.' + (skipped ? ' ' + skipped + ' will be skipped (' + (locked.length? locked.length+' locked':'') + (locked.length && skipped>locked.length ? ', ' : '') + (skipped>locked.length ? (skipped-locked.length)+' not applicable':'') + ').' : ''),
      async ()=>{
        for(let i=0;i<todo.length;i+=20){
          await Promise.all(todo.slice(i,i+20).map(o=>updateOrderField(o.id, patchFor(o,value))));
        }
        incSelected.clear();
        showToast('Updated '+todo.length+' order'+(todo.length!==1?'s':''));
        if(!db) return; renderIncentives(page);
      }, 'Apply', true);
  });
  refreshBar();

  page.querySelectorAll('.inc-lock').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const o = allOrders.find(x=>x.id===btn.dataset.id); if(!o) return;
      const nowLocked = isLocked(o);
      await updateOrderField(o.id, {incentiveLocked: !nowLocked});
      showToast(nowLocked ? 'Unlocked — you can change the status now' : 'Locked');
    });
  });
  const bulkBtn = document.getElementById('btn-bulk-ne');
  if(bulkBtn) bulkBtn.addEventListener('click', ()=>{
    showConfirm('Mark all as not eligible?', `All ${bulkable.length} orders in this view will be marked not eligible for incentive in ${monthLabel(incentiveMonth)}. You can change any order back afterwards.`, async ()=>{
      for(let i=0;i<bulkable.length;i+=20){
        await Promise.all(bulkable.slice(i,i+20).map(o=>updateOrderField(o.id,{paymentStatus:'noteligible', incentiveLocked:false})));
      }
      showToast('Marked '+bulkable.length+' orders not eligible');
    }, 'Confirm', true);
  });

  document.getElementById('btn-export').addEventListener('click', async ()=>{
    const header = 'Incentive Month,Salesman,Order Ref,Channel,Gross Sales,Net Profit,Status,Incentive\n';

/* ============================================================
   PURCHASING
   Masters and import purchase orders, per company:
   companies/{co}/vendors, products, hscodes (doc id = HS code), purchaseOrders, meta/purchasing.
   Landed cost follows the import costing workbook:
     FOB = qty × price; CIF = FOB + freight + insurance (both shared by FOB value)
     BCD = CIF₹ × BCD% × (1 − APTA% when claimed); SWS = BCD × SWS%
     assessable = CIF₹ + BCD + SWS; IGST = assessable × IGST% (input credit, not a cost)
     landed basic cost = assessable + other charges (shared by assessable value); total cost = landed × (1 + GST%)
     selling price = unit landed × (1 + markup), rounded up to the nearest ₹5
   ============================================================ */
// PURCHASING-CALC-START (scripts/seed-purchasing.mjs runs this block against the Excel numbers)
const PO_DEFAULTS = {
  buyer:{name:'', tagline:'', address:'', iec:'', gstin:'', pan:'', phone:'', email:''},
  markups:[20,25,30],
  chargeHeads:['Shipping','Agency','Exam','Docs','CFS','Transport','Forklift','CMC','Empty','Stamp duty','Unloading','Misc'],
  terms:[
    '1. All prices are in USD. Payment as per the payment terms above.',
    '2. Goods to be packed in export-standard cartons / wooden crates suitable for sea freight.',
    '3. All items to meet the specifications listed. Supplier to provide test certificates if required.',
    '4. Delivery schedule to be confirmed upon receipt of order confirmation and deposit.',
    '5. This Purchase Order constitutes a binding contract upon written acceptance by the Supplier.',
  ].join('\n'),
  // PO for customs: defaults for a new PO, and the company stamp / signature image (data URL)
  priceBasis:'CIF Nhava Sheva', shipment:'', packing:'', stamp:'',
};
function poSettings(){
  const p = state.purchasing || {};
  return {...PO_DEFAULTS, ...p, buyer:{...PO_DEFAULTS.buyer, ...(p.buyer||{})}};
}
const toNum = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const isBlank = v => v===null || v===undefined || v==='';
const ceil5 = n => Math.ceil(n/5 - 1e-9) * 5;
const hsByCode = code => state.hscodes.find(h=>h.id===String(code||'')) || null;

/* Drafts use the HS master's current rates; a saved non-draft PO keeps the rates it was saved with. */
function poRate(po, code){
  const live = hsByCode(code), saved = (po.rates||{})[code];
  return po.status==='draft' ? (live || saved || null) : (saved || live || null);
}
function ratesFor(po){
  const out = po.status==='draft' ? {} : {...(po.rates||{})};
  (po.lines||[]).forEach(l=>{
    const h = hsByCode(l.hs);
    if(l.hs && h && !out[l.hs]) out[l.hs] = {bcd:toNum(h.bcd), apta:toNum(h.apta), sws:toNum(h.sws), igst:toNum(h.igst)};
  });
  return out;
}
function computePO(po){
  const lines = po.lines || [];
  const markups = poSettings().markups;
  const fx = toNum(po.rate), shipping = toNum(po.freight) + toNum(po.insurance);
  const fobs = lines.map(l=>toNum(l.qty)*toNum(l.price));
  const totFob = fobs.reduce((a,b)=>a+b,0);
  const rows = lines.map((l,i)=>{
    const r = poRate(po, l.hs);
    const fob = fobs[i];
    const cifUsd = fob + (totFob ? shipping*fob/totFob : 0);
    const cifInr = cifUsd * fx;
    const apta = (po.claimApta && r) ? toNum(r.apta) : 0;
    const bcd = r ? cifInr * toNum(r.bcd)/100 * (1 - apta/100) : 0;
    const sws = r ? bcd * toNum(r.sws)/100 : 0;
    const assess = cifInr + bcd + sws;
    const igst = r ? assess * toNum(r.igst)/100 : 0;
    return {fob, cifUsd, cifInr, apta, bcd, sws, assess, igst, gstPct: r ? toNum(r.igst) : 0, noRate:!r};
  });
  const other = (po.charges||[]).reduce((t,c)=>t+toNum(c.amount),0);
  const totAssess = rows.reduce((t,x)=>t+x.assess,0);
  rows.forEach((x,i)=>{
    const l = lines[i], qty = toNum(l.qty);
    x.landed = totAssess ? x.assess * (1 + other/totAssess) : 0;
    x.unit = qty ? x.landed/qty : 0;
    x.total = x.landed * (1 + x.gstPct/100);   // landed basic cost + the item's GST
    x.spSet = markups.map((m,k)=>!isBlank((l.sp||[])[k]));
    x.sp = markups.map((m,k)=>x.spSet[k] ? toNum(l.sp[k]) : ceil5(x.unit * (1 + toNum(m)/100)));
  });
  const sum = f => rows.reduce((t,x)=>t+f(x),0);
  const lsum = f => lines.reduce((t,l)=>t+f(l),0);
  return {rows, markups, other, totals:{
    qty:lsum(l=>toNum(l.qty)), fob:totFob,
    nw:lsum(l=>toNum(l.nw)*toNum(l.qty)), gw:lsum(l=>toNum(l.gw)*toNum(l.qty)), vol:lsum(l=>toNum(l.vol)*toNum(l.qty)),
    cifUsd:sum(x=>x.cifUsd), cifInr:sum(x=>x.cifInr), bcd:sum(x=>x.bcd), sws:sum(x=>x.sws),
    assess:totAssess, igst:sum(x=>x.igst), landed:sum(x=>x.landed), total:sum(x=>x.total),
  }};
}
// PURCHASING-CALC-END

const PO_STATUS = {draft:{label:'Draft', pill:'pill-pending'}, ordered:{label:'Ordered', pill:'pill-partial'}, received:{label:'Received', pill:'pill-paid'}};
const fmtFx = n => (toNum(n)<0?'−':'') + Math.abs(toNum(n)).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtQty = (n, d=2) => toNum(n).toLocaleString('en-IN',{maximumFractionDigits:d});
const vendorById = id => state.vendors.find(v=>v.id===id) || null;
const productLabel = p => p.spec ? p.name + ' — ' + p.spec : (p.name||'');
const byText = f => (a,b)=>String(f(a)||'').localeCompare(String(f(b)||''), undefined, {numeric:true});
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Vendor shown on a PO: live record while drafting, the copy saved with it afterwards. */
function poVendor(po){
  const live = vendorById(po.vendorId), saved = po.vendor && po.vendor.name ? po.vendor : null;
  return (po.status==='draft' ? (live || saved) : (saved || live)) || {};
}

async function savePo(page){
  const d = poOpen.draft;
  d.poNumber = String(d.poNumber||'').trim();
  if(!d.poNumber){ showToast('Enter a PO number'); return; }
  if(state.pos.some(p=>p.id!==poOpen.id && p.poNumber===d.poNumber)){ showToast(d.poNumber+' is already used by another PO'); return; }
  const v = vendorById(d.vendorId);
  const body = {...d, updatedAt:new Date().toISOString(), rates:ratesFor(d)};
  if(v) body.vendor = {name:v.name||'', contact:v.contact||'', address:v.address||'', email:v.email||'', phone:v.phone||'', country:v.country||'',
    accountNo:v.accountNo||'', bank:v.bank||'', swift:v.swift||''};
  const id = poOpen.id || ('po_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
  if(!poOpen.id) body.createdAt = body.updatedAt;
  const btn = document.getElementById('po-save');
  if(btn) btn.disabled = true;
  try{
    await fb.setDoc(docRef('purchaseOrders/'+id), body);
  }catch(ex){
    console.error(ex);
    showToast('Could not save: ' + (ex.code==='permission-denied' ? 'this account can\'t edit purchase orders' : ex.message));
    if(btn) btn.disabled = false;
    return;
  }
  poOpen = {id, draft:JSON.parse(JSON.stringify(body)), dirty:false};
  // Ordered and received POs set each product's last price.
  if(d.status!=='draft'){
    for(const l of d.lines){
      const p = state.products.find(x=>x.id===l.productId);
      if(p && !isBlank(l.price) && (toNum(p.lastPrice)!==toNum(l.price) || p.lastPo!==d.poNumber)){
        try{ await fb.updateDoc(docRef('products/'+p.id), {lastPrice:toNum(l.price), lastPo:d.poNumber}); }
        catch(ex){ console.error('last price update failed', ex); }
      }
    }
  }
  renderPoEditor(page);
  showToast(d.poNumber + ' saved');
}

/* Beneficiary bank lines for the supplier PO; empty when the vendor has no bank details. */
function vendorBankRows(v){
  if(!(v.accountNo || v.bank || v.swift)) return [];
  return [['Beneficiary', v.name], ['A/c No.', v.accountNo], ['Bank', v.bank], ['SWIFT / BIC', v.swift]].filter(([,val])=>val);
}

let excelJsLoad = null;
function loadExcelJs(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!excelJsLoad) excelJsLoad = new Promise((ok, fail)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload = ()=>ok(window.ExcelJS);
    s.onerror = ()=>{ excelJsLoad = null; fail(new Error('Could not load the Excel library. Check the internet connection.')); };
    document.head.appendChild(s);
  });

}

function xlKit(ws){
  const thin = {style:'thin', color:{argb:XL.line}};
  const border = {top:thin, left:thin, bottom:thin, right:thin};
  const fill = argb => ({type:'pattern', pattern:'solid', fgColor:{argb}});

  const put = (r, c1, c2, value, st={}) => {
    if(c2 > c1) ws.mergeCells(r, c1, r, c2);
    for(let c=c1; c<=c2; c++){ const x = ws.getCell(r, c); x.border = border; if(st.fill) x.fill = fill(st.fill); }
    const cell = ws.getCell(r, c1);
    cell.value = value;
    if(st.font) cell.font = st.font;
    if(st.fmt) cell.numFmt = st.fmt;
    cell.alignment = {vertical:'middle', wrapText:true, ...(typeof value==='number' ? {horizontal:'right'} : {}), ...(st.align||{})};
    return cell;
  };
  const band = (r, c1, c2, text) => put(r, c1, c2, text, {fill:XL.navy, font:{bold:true, color:{argb:XL.white}}});
  const label = (r, c1, c2, text) => put(r, c1, c2, text, {fill:XL.band, font:{bold:true}});
  const header = (r, heads, fills=[]) => {
    heads.forEach((h,i)=>put(r, i+1, i+1, h, {fill:fills[i]||XL.navy, font:{bold:true, color:{argb:fills[i] ? XL.ink : XL.white}}, align:{horizontal:'center'}}));
    ws.getRow(r).height = 34;
  };
  const line = (r, values, fmts, st={}) => values.forEach((v,i)=>put(r, i+1, i+1, v, {fmt:fmts[i], fill:st.fill, font:(st.bold||[]).includes(i) ? {bold:true} : undefined}));
  // wrapped text in merged cells doesn't grow the row by itself
  const fit = (r, texts) => { ws.getRow(r).height = Math.max(18, ...texts.map(([txt, perLine])=>Math.ceil(String(txt||'').length / perLine) * 15)); };
  return {put, band, label, header, line, fit};
}
async function saveWorkbook(wb, filename){

}

/* "Fifty-Six Thousand Seven Hundred Seventy-Eight and Forty-Two Cents" style amounts. */
function amountInWords(amount, cur){
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? ones[x] : tens[Math.floor(x/10)] + (x%10 ? '-' + ones[x%10] : '');
  const three = x => [x >= 100 ? ones[Math.floor(x/100)] + ' Hundred' : '', x%100 ? two(x%100) : ''].filter(Boolean).join(' ');
  const words = x => x ? [[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand'],[1,'']]
    .map(([div, name])=>{ const q = Math.floor(x/div) % 1000; return q ? three(q) + (name ? ' ' + name : '') : ''; }).filter(Boolean).join(' ') : 'Zero';
  const cents = Math.round(toNum(amount)*100), whole = Math.floor(cents/100), part = cents % 100;
  const unit = cur==='USD' ? 'US Dollars' : cur;
  return `${unit} ${words(whole)}${part ? ` and ${two(part)} Cents` : ''} Only`;
}

  ws['!cols'] = fields.map(k=>({wch: k==='name'||k==='spec' ? 34 : 18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const arr = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  downloadBlob(new Blob([arr], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), companyLabel(company()).replace(/\s+/g,'-') + '-' + filename);
  showToast('Template ready');
}
/* Reads the first sheet that has an item-name column. The header row can be anywhere in the first
   40 rows, so a PO costing workbook can be uploaded as it is; a blank item name repeats the one
   above it (merged cells), and a TOTAL row ends the list. */
async function readBulkFile(file, fields){
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  for(const sn of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:true});
    for(let h=0; h<Math.min(aoa.length, 40); h++){
      const col = {};
      (aoa[h]||[]).forEach((cell, ci)=>{
        const n = normHeader(cell);
        const k = n && fields.find(f=>col[f]===undefined && BULK_COLS[f].match(n));
        if(k) col[k] = ci;
      });
      if(col.name===undefined) continue;
      const rows = [];
      let carry = '';
      for(let r=h+1; r<aoa.length; r++){
        const row = aoa[r] || [];
        if([row[0], row[col.name]].some(v=>/^totals?$/i.test(String(v).trim()))) break;
        const o = {row:r+1};
        fields.forEach(f=>{
          if(col[f]===undefined) return;
          const v = row[col[f]];
          o[f] = BULK_COLS[f].num ? (isBlank(v) ? '' : toNum(v)) : String(v??'').replace(/\s+/g,' ').trim();
        });
        if(o.name) carry = o.name; else if(o.spec) o.name = carry;
        if(o.name) rows.push(o);
      }
      return rows;
    }
  }
  return null;
}
async function writeDocs(coll, writes){
  for(let i=0; i<writes.length; i+=20){
    await Promise.all(writes.slice(i, i+20).map(w=>fb.setDoc(docRef(coll+'/'+w.id), w.data, {merge:true})));
  }
}

/* Products master: new rows are added, rows matching an existing product update it (blank cells leave a value as it is). */
async function uploadProducts(file){
  let rows = null;
  try{ rows = await readBulkFile(file, PRODUCT_UPLOAD); }catch(ex){ console.error(ex); }
  if(!rows || !rows.length){ showToast('No products found: the file needs an "Item name" column'); return; }
  const existing = new Map(state.products.map(p=>[productKey(p.name, p.spec), p]));
  const writes = new Map();
  let added = 0, updated = 0;
  rows.forEach(o=>{
    const key = productKey(o.name, o.spec), data = {};
    ['name','spec','hs'].forEach(k=>{ if(o[k]) data[k] = o[k]; });
    ['nw','gw','vol','lastPrice'].forEach(k=>{ if(!isBlank(o[k])) data[k] = o[k]; });
    if(writes.has(key)){ Object.assign(writes.get(key).data, data); return; }
    const ex = existing.get(key);
    if(ex){ writes.set(key, {id:ex.id, data}); updated++; }
    else{ writes.set(key, {id:newId('prd'), data:{name:o.name, spec:o.spec||'', hs:'', nw:null, gw:null, vol:null, lastPrice:null, ...data}}); added++; }
  });
  showChoices(`Upload ${writes.size} product${writes.size!==1?'s':''}?`,
    `${added} new product${added!==1?'s':''} will be added and ${updated} existing product${updated!==1?'s':''} updated with the file's values. Blank cells leave existing values as they are.`,
    [{label:'Upload', primary:true, run:async ()=>{
      try{ await writeDocs('products', [...writes.values()]); showToast(`Products uploaded: ${added} new, ${updated} updated`); }
      catch(ex){ console.error(ex); showToast(ex.code==='permission-denied' ? 'This account can\'t edit products' : 'Upload failed: ' + ex.message); }
    }}]);
}

/* PO items: each row is matched to a product by item name + description; rows that match none
   create a new product in the master. File values fill the line; blank cells fall back to the product. */
async function uploadPoItems(file, page){
  const d = poOpen.draft;
  let rows = null;
  try{ rows = await readBulkFile(file, PO_ITEM_UPLOAD); }catch(ex){ console.error(ex); }
  rows = (rows||[]).filter(o=>toNum(o.qty) > 0);
  if(!rows.length){ showToast('No items found: the file needs "Item name" and "Qty" columns'); return; }
  const existing = new Map(state.products.map(p=>[productKey(p.name, p.spec), p]));
  const created = new Map();
  const lines = rows.map(o=>{
    const key = productKey(o.name, o.spec);
    let p = existing.get(key) || created.get(key);
    if(!p){
      p = {id:newId('prd'), name:o.name, spec:o.spec||'', hs:o.hs||'', nw:isBlank(o.nw)?null:o.nw, gw:isBlank(o.gw)?null:o.gw, vol:isBlank(o.vol)?null:o.vol, lastPrice:null};
      created.set(key, p);
    }
    const pick = (k, fallback) => isBlank(o[k]) ? (isBlank(fallback) ? '' : fallback) : o[k];
    return {productId:p.id, item:p.name, spec:p.spec||'', qty:o.qty, price:pick('price', p.lastPrice),
      nw:pick('nw', p.nw), gw:pick('gw', p.gw), vol:pick('vol', p.vol), hs:o.hs || p.hs || '', sp:[]};
  });
  const newProducts = [...created.values()];
  const apply = replace => async ()=>{
    if(newProducts.length){
      try{ await writeDocs('products', newProducts.map(({id, ...data})=>({id, data}))); }
      catch(ex){
        console.error(ex);
        showToast(ex.code==='permission-denied' ? 'This account can\'t add products, so nothing was uploaded' : 'Upload failed: ' + ex.message);
        return;
      }
    }
    d.lines = replace ? lines : d.lines.concat(lines);
    poOpen.dirty = true;
    renderPoEditor(page);
    showToast(`${lines.length} item${lines.length!==1?'s':''} added. Save the PO to keep them.`);
  };
  const noPrice = lines.filter(l=>isBlank(l.price)).length;
  showChoices(`Upload ${lines.length} item${lines.length!==1?'s':''}?`,
    `${lines.length - lines.filter(l=>created.has(productKey(l.item, l.spec))).length} match products already in Masters.`
    + (newProducts.length ? `<div class="section-note" style="margin:12px 0 0;">${newProducts.length} new product${newProducts.length!==1?'s':''} will be added to Masters → Products:<br>${nameList(newProducts.map(productLabel))}</div>` : '')
    + (noPrice ? `<div class="hint" style="margin-top:10px;">${noPrice} item${noPrice!==1?'s have':' has'} no unit price yet.</div>` : ''),
    [...(d.lines.length ? [{label:`Replace the ${d.lines.length} current items`, run:apply(true)}] : []),
     {label:d.lines.length ? 'Add to the end' : 'Upload', primary:true, run:apply(false)}]);
}

/* Scale an uploaded image down to maxWidth and return it as a data URL small enough to keep in a
   Firestore document (PNG keeps transparency; falls back to JPEG if the PNG is too large). */
async function shrinkImage(file, maxWidth){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, fail)=>{ const i = new Image(); i.onload = ()=>ok(i); i.onerror = fail; i.src = url; });
    const scale = Math.min(1, maxWidth / img.naturalWidth);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    let data = canvas.toDataURL('image/png');
    if(data.length > 600000){
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      data = canvas.toDataURL('image/jpeg', 0.85);
    }
    return data;
  }finally{ URL.revokeObjectURL(url); }
}

          <div class="field"><label>Packing</label><input name="packing" value="${escapeAttr(s.packing)}" placeholder="e.g. Pallet. Shipping mark: as per buyer's requirements."></div>
        </div>
        <div class="panel">
          <h3>Company stamp &amp; signature</h3>
          <div class="stamp-preview" id="pos-stamp-preview">${s.stamp ? `<img src="${s.stamp}" alt="Company stamp">` : '<span class="muted">No stamp uploaded</span>'}</div>
          <div class="toolbar" style="margin:10px 0 0;">
            <button type="button" class="btn btn-sm" id="pos-stamp-pick">${s.stamp ? 'Replace image' : 'Upload image'}</button>
            <button type="button" class="btn btn-sm btn-danger" id="pos-stamp-clear" ${s.stamp ? '' : 'hidden'}>Remove</button>
            <input type="file" id="pos-stamp-file" accept="image/png,image/jpeg,image/webp" hidden>
          </div>
          <div class="hint">Printed above "Authorised Signatory" on the PO for customs. A PNG with a transparent background looks best. Save PO settings after changing it.</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Save PO settings</button>
    </form>`;
  const form = document.getElementById('pos-form');
  let stamp = s.stamp;
  const showStamp = () => {
    document.getElementById('pos-stamp-preview').innerHTML = stamp ? `<img src="${stamp}" alt="Company stamp">` : '<span class="muted">No stamp uploaded</span>';
    document.getElementById('pos-stamp-pick').textContent = stamp ? 'Replace image' : 'Upload image';
    document.getElementById('pos-stamp-clear').hidden = !stamp;
  };
  const stampFile = document.getElementById('pos-stamp-file');
  document.getElementById('pos-stamp-pick').addEventListener('click', ()=>stampFile.click());
  document.getElementById('pos-stamp-clear').addEventListener('click', ()=>{ stamp = ''; showStamp(); });
  stampFile.addEventListener('change', async ()=>{
    const f = stampFile.files[0];
    stampFile.value = '';
    if(!f) return;
    try{ stamp = await shrinkImage(f, 480); showStamp(); }
    catch(ex){ console.error(ex); showToast('Could not read that image'); }
  });
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const buyer = {};
    Object.keys(PO_DEFAULTS.buyer).forEach(k=>{ buyer[k] = form.elements['b-'+k].value.trim(); });
    const markups = s.markups.map((m,i)=>toNum(form.elements['mk'+i].value));
    const chargeHeads = form.elements.heads.value.split('\n').map(x=>x.trim()).filter(Boolean);
    try{
      await fb.setDoc(docRef('meta/purchasing'), {buyer, markups, chargeHeads, terms:form.elements.terms.value.trim(),
        priceBasis:form.elements.priceBasis.value.trim(), shipment:form.elements.shipment.value.trim(), packing:form.elements.packing.value.trim(), stamp});
      showToast('PO settings saved');
    }catch(ex){
      console.error(ex);
      showToast(ex.code==='permission-denied' ? 'This account can\'t edit PO settings' : 'Could not save PO settings');
    }
  });
}

/* ============================================================
   USERS (admin only)
   ============================================================ */
const ASSIGNABLE_PAGES = () => PAGES.filter(p=>!p.adminOnly);
/* One block of tab checkboxes per company; a company with nothing ticked is no access. */
function companyTabChecks(u, admin){
  return COMPANIES.map(c=>{
    const selected = tabsFor(u, c.id);
    return `<div class="field"><label>${escapeHtml(companyLabel(c))}: tabs this user can open</label>
      <div class="tab-checks ${admin?'off':''}" data-company="${c.id}">${ASSIGNABLE_PAGES().map(p=>`
        <label class="tab-check"><input type="checkbox" value="${p.id}" ${admin||selected.includes(p.id)?'checked':''}> ${escapeHtml(p.label)}</label>`).join('')}</div>
    </div>`;
  }).join('') + `<div class="hint" style="margin:-6px 0 12px;">Leave every tab unticked for a company to keep this user out of it.</div>`;
}
function readAccess(root){
  const access = {};
  root.querySelectorAll('.tab-checks[data-company]').forEach(box=>{
    access[box.dataset.company] = [...box.querySelectorAll('input:checked')].map(i=>i.value);
  });
  return access;
}
const hasAnyTab = access => Object.values(access).some(list=>list.length);
function wireRoleToggle(root){
  const sel = root.querySelector('select[name="role"]');
  const sync = ()=>{
    root.querySelectorAll('.tab-checks').forEach(box=>{
      box.classList.toggle('off', sel.value==='admin');
      if(sel.value==='admin') box.querySelectorAll('input').forEach(i=>{ i.checked = true; });
    });
  };
  sel.addEventListener('change', sync);
}
function userTabsLabel(u){
  if(u.role==='admin') return 'All tabs, all companies';
  return COMPANIES.map(c=>{
    const labels = ASSIGNABLE_PAGES().filter(p=>tabsFor(u, c.id).includes(p.id)).map(p=>p.label);
    return `<b>${escapeHtml(c.name)}:</b> ${labels.length ? escapeHtml(labels.join(', ')) : 'no access'}`;
  }).join('<br>');
}
const AUTH_ERRORS = {
  'auth/email-already-in-use':'An account with this email already exists.',
  'auth/invalid-email':'That email address is not valid.',
  'auth/weak-password':'Password must be at least 6 characters.',
};

function renderUsers(page){
  const users = [...state.users].sort((a,b)=>(b.active===true)-(a.active===true) || String(a.name||a.email).localeCompare(String(b.name||b.email)));
  page.innerHTML = `
    <div class="pagehead"><div><h1>Users</h1><p>Add people who can sign in, and choose which companies and tabs each one can open. Users are shared by all companies.</p></div></div>

    <div class="panel" style="margin-bottom:18px;">
      <h3>Add user</h3>
      <form id="u-add">
        <div class="field-row">
          <div class="field"><label>Name</label><input name="name" required placeholder="e.g. Ajay"></div>
          <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="off"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Starting password</label><input name="password" type="text" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div>
          <div class="field"><label>Role</label><select name="role"><option value="user">User: only the tabs ticked below</option><option value="admin">Admin: all tabs, can manage users</option></select></div>
        </div>
        ${companyTabChecks(null, false)}
        <p id="u-add-error" style="color:var(--negative);font-size:13px;margin:0;min-height:18px;"></p>
        <button type="submit" class="btn btn-primary btn-sm" id="u-add-btn">Add user</button>
        <div class="hint">Give the person their email and starting password. They can change it with "Forgot password" on the sign-in screen.</div>
      </form>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Tabs</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${users.map(u=>`
          <tr>
            <td>${escapeHtml(u.name||'—')}${u.uid===state.me.uid?' <span class="hint">(you)</span>':''}</td>
            <td>${escapeHtml(u.email||'')}</td>
            <td>${u.role==='admin'?'Admin':'User'}</td>
            <td style="max-width:360px;">${userTabsLabel(u)}</td>
            <td>${u.active===true?'<span class="pill pill-paid">Active</span>':'<span class="pill pill-pending">Disabled</span>'}</td>
            <td style="text-align:right;"><button class="btn btn-sm u-edit" data-uid="${escapeAttr(u.uid)}">Edit</button></td>
          </tr>`).join('') || '<tr><td colspan="6" class="empty">No users yet.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  const form = document.getElementById('u-add');
  wireRoleToggle(form);
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const err = document.getElementById('u-add-error');
    const btn = document.getElementById('u-add-btn');
    err.textContent = '';
    const email = form.email.value.trim().toLowerCase();
    const role = form.role.value;
    const access = role==='admin' ? {} : readAccess(form);
    if(role!=='admin' && !hasAnyTab(access)){ err.textContent = 'Tick at least one tab in one company.'; return; }
    btn.disabled = true;
    try{
      const uid = await fb.createUser(email, form.password.value);
      await saveUser(uid, {email, name:form.name.value.trim(), role, access, active:true, createdAt:new Date().toISOString()});
      showToast('User added: ' + email);
    }catch(ex){
      console.error(ex);
      err.textContent = AUTH_ERRORS[ex.code] || 'Could not add the user. ' + (ex.message||'');
      btn.disabled = false;
    }
  });

  page.querySelectorAll('.u-edit').forEach(b=>b.addEventListener('click', ()=>openUserModal(b.dataset.uid)));
}

function openUserModal(uid){
  const u = state.users.find(x=>x.uid===uid);
  if(!u) return;
  const self = uid === state.me.uid;
  closeAllOverlays();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Edit user</h2>
      <form id="u-edit-form">
        <div class="field"><label>Email</label><input value="${escapeAttr(u.email||'')}" disabled></div>
        <div class="field-row">
          <div class="field"><label>Name</label><input name="name" value="${escapeAttr(u.name||'')}"></div>
          <div class="field"><label>Role</label><select name="role" ${self?'disabled':''}>
            <option value="user" ${u.role!=='admin'?'selected':''}>User</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
          </select></div>
        </div>
        ${companyTabChecks(u, u.role==='admin')}
        <div class="field"><label class="tab-check"><input type="checkbox" name="active" ${u.active===true?'checked':''} ${self?'disabled':''}> Account active (untick to block this person from signing in to the ledger)</label></div>
        ${self?'<div class="hint">You can\'t remove your own admin role or disable yourself.</div>':''}
        <p id="u-edit-error" style="color:var(--negative);font-size:13px;margin:0;min-height:18px;"></p>
        <div class="modal-foot">
          <button type="button" class="btn" id="u-reset" style="margin-right:auto;">Send password reset email</button>
          <button type="button" class="btn" id="u-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const form = overlay.querySelector('#u-edit-form');
  wireRoleToggle(form);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#u-cancel').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#u-reset').addEventListener('click', async ()=>{
    try{ await fb.resetPassword(u.email); showToast('Reset email sent to ' + u.email); }
    catch(ex){ overlay.querySelector('#u-edit-error').textContent = 'Could not send the reset email.'; }
  });
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const role = self ? 'admin' : form.role.value;
    const access = role==='admin' ? {} : readAccess(form);
    const active = self ? true : form.active.checked;
    if(role!=='admin' && active && !hasAnyTab(access)){ overlay.querySelector('#u-edit-error').textContent = 'Tick at least one tab in one company.'; return; }
    try{
      await saveUser(uid, {name:form.name.value.trim(), role, access, active});
      overlay.remove();
      showToast('Saved');
    }catch(ex){ console.error(ex); overlay.querySelector('#u-edit-error').textContent = 'Could not save. ' + (ex.message||''); }
  });
}

/* ============================================================
   EXPENSES & TRUE NET PROFIT
   ============================================================ */
const EXPENSE_FIELDS = [
  {key:'salaries', label:'Salaries'},
  {key:'rent', label:'Rent'},
  {key:'electricity', label:'Electricity'},
  {key:'fuel', label:'Fuel & transportation'},
  {key:'marketing', label:'IndiaMart & marketing'},
  {key:'other', label:'Other miscellaneous expenses'},
];
let expensesFY = 'all';
let expDraft = null;
function renderExpenses(page){
  const fys = availableFYs();
  if(expensesFY!=='all' && !fys.includes(expensesFY)) expensesFY = 'all';
  const saved = state.expenses || {};
  const val = k => ((expDraft||{})[k]!==undefined ? expDraft[k] : (saved[k]||0));
  const monthlyTotal = () => EXPENSE_FIELDS.reduce((t,f)=>t+(parseFloat(val(f.key))||0),0);

  const orders = computedOrders().filter(o=> o.ledgerMonth && o.netProfit!==null && (expensesFY==='all' || fyStartYear(o.ledgerMonth)===expensesFY));
  const byMonth = {};
  computedOrders().forEach(o=>{
    if(!o.ledgerMonth) return;
    if(expensesFY!=='all' && fyStartYear(o.ledgerMonth)!==expensesFY) return;
    byMonth[o.ledgerMonth] = byMonth[o.ledgerMonth] || 0;
    if(o.netProfit!==null) byMonth[o.ledgerMonth] += o.netProfit;
  });
  const months = Object.keys(byMonth).sort();
  const totalNet = round2(months.reduce((t,m)=>t+byMonth[m],0));

  page.innerHTML = `
    <div class="pagehead">
      <div><h1>Expenses &amp; True NP</h1><p>Enter your monthly expenses. True net profit = net profit minus monthly expenses × the number of months with data.</p></div>
      <div class="actions"><select id="exp-fy" style="width:auto;min-width:130px;">
        <option value="all" ${expensesFY==='all'?'selected':''}>All years</option>
        ${fys.map(y=>`<option value="${y}" ${expensesFY===y?'selected':''}>${fyLabel(y)}</option>`).join('')}
      </select></div>
    </div>
    <div class="chart-row" style="align-items:flex-start;">
      <div class="panel">
        <h3>Monthly expenses</h3>
        ${EXPENSE_FIELDS.map(f=>`
          <div class="field"><label>${f.label}</label><input type="number" step="any" min="0" class="exp-in" data-key="${f.key}" value="${val(f.key)||''}" placeholder="0"></div>`).join('')}
        <div class="exp-total"><span>Total per month</span><span class="num" id="exp-monthly">${fmtMoney(monthlyTotal())}</span></div>
        <div style="margin-top:14px;display:flex;gap:8px;align-items:center;">
          <button class="btn btn-primary" id="exp-save">Save expenses</button>
          <span class="hint" id="exp-dirty" style="margin:0;"></span>
        </div>
      </div>
      <div>
        <div class="kpi-row" style="grid-template-columns:1fr 1fr;">
          <div class="kpi"><div class="label">Net profit</div><div class="value num">${fmtMoney(totalNet)}</div><div class="sub">from sale orders</div></div>
          <div class="kpi"><div class="label">Months of data</div><div class="value num">${months.length}</div><div class="sub">${months.length?escapeHtml(monthLabel(months[0]))+(months.length>1?' – '+escapeHtml(monthLabel(months[months.length-1])):''):'none yet'}</div></div>
          <div class="kpi"><div class="label">Total expenses</div><div class="value num neg" id="exp-total-all">${fmtMoney(monthlyTotal()*months.length)}</div><div class="sub" id="exp-total-sub">${fmtMoney(monthlyTotal())} × ${months.length} month${months.length!==1?'s':''}</div></div>
          <div class="kpi hero"><div class="label">True net profit</div><div class="value num" id="exp-true">${fmtMoney(round2(totalNet - monthlyTotal()*months.length))}</div><div class="sub">net profit − expenses</div></div>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-bottom:18px;"><h3>Net profit vs true net profit by month</h3><div class="panel-chart"><canvas id="chTrue"></canvas></div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Month</th><th class="num">Net profit</th><th class="num">Expenses</th><th class="num">True net profit</th></tr></thead>
        <tbody id="exp-rows"></tbody>
        <tfoot><tr class="tot-row"><td>Total · ${months.length} month${months.length!==1?'s':''}</td><td class="num" id="ft-net"></td><td class="num" id="ft-exp"></td><td class="num" id="ft-true"></td></tr></tfoot>
      </table>
    </div>
  `;

  const dirty = () => EXPENSE_FIELDS.some(f=> (parseFloat(val(f.key))||0) !== (parseFloat(saved[f.key])||0));
  function recalc(){
    const mt = monthlyTotal();
    document.getElementById('exp-monthly').textContent = fmtMoney(mt);
    document.getElementById('exp-total-all').textContent = fmtMoney(mt*months.length);
    document.getElementById('exp-total-sub').textContent = fmtMoney(mt)+' × '+months.length+' month'+(months.length!==1?'s':'');
    const tn = round2(totalNet - mt*months.length);
    const te = document.getElementById('exp-true'); te.textContent = fmtMoney(tn); te.className = 'value num '+(tn>=0?'pos':'neg');
    document.getElementById('exp-rows').innerHTML = months.map(m=>{
      const t = round2(byMonth[m]-mt);
      return `<tr><td>${escapeHtml(monthLabel(m))}</td><td class="num">${fmtMoney(round2(byMonth[m]))}</td><td class="num">${fmtMoney(mt)}</td><td class="num ${t>=0?'':'neg'}" style="font-weight:600;">${fmtMoney(t)}</td></tr>`;
    }).join('') || '<tr><td colspan="4" class="empty">No months with data yet.</td></tr>';
    document.getElementById('ft-net').textContent = fmtMoney(totalNet);
    document.getElementById('ft-exp').textContent = fmtMoney(mt*months.length);
    document.getElementById('ft-true').textContent = fmtMoney(tn);
    document.getElementById('exp-dirty').textContent = dirty() ? 'Unsaved changes' : '';
    if(charts.trueNP){
      charts.trueNP.data.datasets[1].data = months.map(m=>round2(byMonth[m]-mt));
      charts.trueNP.update();
    }
  }
  charts.trueNP = new Chart(document.getElementById('chTrue'), {
    data:{labels:months.map(m=>MONTH_NAMES[parseInt(m.split('-')[1],10)-1].slice(0,3)+' '+m.slice(2,4)), datasets:[
      {type:'bar', label:'Net profit', data:months.map(m=>round2(byMonth[m])), backgroundColor:'#7FA7C9', borderRadius:3, maxBarThickness:42},
      {type:'line', label:'True net profit', data:months.map(m=>round2(byMonth[m]-monthlyTotal())), borderColor:'#F59E0B', backgroundColor:'#F59E0B', tension:.3, pointRadius:3}
    ]},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      plugins:{legend:{display:true, position:'top', labels:{color:getSoftColor(), font:{family:'IBM Plex Sans', size:12}, boxWidth:12}}, tooltip:{callbacks:{label:(c)=>c.dataset.label+': '+fmtMoney(c.parsed.y)}}},
      scales:{x:{grid:{display:false}, ticks:{color:getSoftColor()}}, y:{grid:{color:getGridColor()}, ticks:{color:getSoftColor(), font:{family:'IBM Plex Mono', size:10}, callback:v=>fmtMoney(v)}}}}
  });
  recalc();

  page.querySelectorAll('.exp-in').forEach(inp=>{
    inp.addEventListener('input', ()=>{ expDraft = {...(expDraft||{})}; expDraft[inp.dataset.key] = inp.value; recalc(); });
  });
  document.getElementById('exp-save').addEventListener('click', async ()=>{
    const out = {};
    EXPENSE_FIELDS.forEach(f=>{ out[f.key] = parseFloat(val(f.key))||0; });
    expDraft = null;
    await saveExpenses(out);
    showToast('Expenses saved');
  });
  document.getElementById('exp-fy').addEventListener('change', e=>{ expensesFY = e.target.value==='all' ? 'all' : parseInt(e.target.value,10); renderExpenses(page); });
}

/* ============================================================
   MONTHLY SUMMARY
   ============================================================ */
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(key){
  if(!key) return 'No date';
  const [y,m] = key.split('-');
  return MONTH_NAMES[parseInt(m,10)-1] + ' ' + y;
}
function renderMonthly(page){
  const orders = computedOrders();
  const groups = {};
  orders.forEach(o=>{
    const key = o.ledgerMonth || (o.date ? o.date.slice(0,7) : 'undated');
    if(!groups[key]) groups[key] = {key, count:0, gross:0, net:0, netKnown:0, pending:0, incentive:0, paid:0};
    const g = groups[key];
    g.count++;
    g.gross += o.grossSales;
    if(o.netProfit!==null){ g.net += o.netProfit; g.netKnown++; }
    if(o.status!=='full') g.pending += o.grossSales;
    g.incentive += o.incentive;
    if(o.status==='full') g.paid++;
  });
  const rows = Object.values(groups).sort((a,b)=> b.key.localeCompare(a.key));

  page.innerHTML = `
    <div class="pagehead"><div><h1>Monthly Summary</h1><p>Sale orders grouped by ledger month — sales, profit and incentive trend over time.</p></div></div>
    <div class="chart-row" style="grid-template-columns:1fr;">
      <div class="panel"><h3>Gross sales &amp; net profit by month</h3><div class="panel-chart"><canvas id="chMonthly"></canvas></div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Month</th><th class="num">Orders</th><th class="num">Gross sales</th><th class="num">Net profit</th>
        </tr></thead>
        <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${escapeHtml(monthLabel(r.key))}</td>
            <td class="num">${r.count}</td>
            <td class="num">${fmtMoney(r.gross)}</td>
            <td class="num">${r.netKnown? fmtMoney(round2(r.net)) : '—'}</td>
          </tr>`).join('') || '<tr><td colspan="4" class="empty">No orders yet.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  const chronological = [...rows].sort((a,b)=> a.key.localeCompare(b.key));
  charts.monthly = new Chart(document.getElementById('chMonthly'), {
    type:'bar',
    data:{
      labels: chronological.map(r=>monthLabel(r.key)),
      datasets:[
        {label:'Gross sales', data:chronological.map(r=>round2(r.gross)), backgroundColor:getAccentColor(), borderRadius:2, maxBarThickness:34},
        {label:'Net profit', data:chronological.map(r=>round2(r.net)), backgroundColor:getInkColor(), borderRadius:2, maxBarThickness:34},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:true, position:'top', labels:{color:getSoftColor(), font:{family:'IBM Plex Sans', size:12}, boxWidth:12}}, tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+': '+fmtMoney(ctx.parsed.y)}}},
      scales:{
        x:{grid:{display:false}, ticks:{color:getSoftColor(), font:{family:'IBM Plex Sans', size:11}}},
        y:{grid:{color:getGridColor()}, ticks:{color:getSoftColor(), font:{family:'IBM Plex Mono', size:10}, callback:v=>fmtMoney(v)}}
      }
    }
  });
}

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function showConfirm(title, body, onConfirm, okLabel, safe){
  closeAllOverlays();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.alignItems = 'center';
  overlay.innerHTML = `
    <div class="modal" style="max-width:380px;">
      <h2 style="font-size:17px;">${escapeHtml(title)}</h2>
      <p style="color:var(--ink-soft);font-size:13px;margin:0 0 4px;">${escapeHtml(body)}</p>
      <div class="modal-foot">
        <button class="btn" id="confirm-cancel">Cancel</button>
        <button class="btn ${safe?'btn-primary':'btn-danger'}" ${safe?'':'style="border-color:var(--negative);"'} id="confirm-ok">${escapeHtml(okLabel||'Delete')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#confirm-cancel').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#confirm-ok').addEventListener('click', async ()=>{
    overlay.remove();
    await onConfirm();
  });
}
let toastTimer=null;
function showToast(msg){
  let el = document.querySelector('.toast');
  if(el) el.remove();
  el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 2200);
}

/* Sign-in screen (Firebase Auth, email + password). Accounts are created in the
   Firebase console; there is no self sign-up. */
function showLogin(onSubmit, onReset){
  closeAllOverlays();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'login-overlay';
  overlay.style.alignItems = 'center';
  overlay.innerHTML = `
    <div class="modal" style="max-width:380px;">
      <h2>Sign in</h2>
      <form id="login-form">
        <div class="field"><label>Company</label><select name="company">
          ${COMPANIES.map(c=>`<option value="${c.id}" ${c.id===currentCompany?'selected':''}>${escapeHtml(companyLabel(c))}</option>`).join('')}
        </select></div>
        <div class="field"><label>Email</label><input required type="email" name="email" autocomplete="username"></div>
        <div class="field"><label>Password</label><input required type="password" name="password" autocomplete="current-password"></div>
        <p id="login-error" style="color:var(--negative);font-size:13px;margin:0;min-height:18px;"></p>
        <div class="modal-foot">
          <button type="button" class="btn" id="login-reset">Forgot password</button>
          <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  const form = overlay.querySelector('#login-form');
  const err = overlay.querySelector('#login-error');
  form.company.addEventListener('change', ()=>{
    currentCompany = form.company.value;
    rememberCompany(currentCompany);
    showCompanyBrand();
  });
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    err.textContent = '';
    const btn = overlay.querySelector('#login-submit');
    btn.disabled = true;
    try{ await onSubmit(form.email.value.trim(), form.password.value); }
    catch(ex){ err.textContent = 'Wrong email or password.'; btn.disabled = false; }
  });
  overlay.querySelector('#login-reset').addEventListener('click', async ()=>{
    const email = form.email.value.trim();
    if(!email){ err.textContent = 'Enter your email first.'; return; }
    try{ await onReset(email); showToast('Password reset email sent'); }
    catch(ex){ err.textContent = 'Could not send reset email.'; }
  });
}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, terminate, clearIndexedDbPersistence,
  collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, query, limit } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyCnRbxcrCl_sqiILspT-pNScxmI6adYc_s',
  authDomain: 'alfa-ledger-14b79.firebaseapp.com',
  projectId: 'alfa-ledger-14b79',
  storageBucket: 'alfa-ledger-14b79.firebasestorage.app',
  messagingSenderId: '34522754631',
  appId: '1:34522754631:web:1468c47ac8f61534f04b62',
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// Admins create accounts through a second app instance, so creating a user
// doesn't sign the admin out of the main one.
const userAdminAuth = getAuth(initializeApp(firebaseConfig, 'user-admin'));
async function createUser(email, password){
  const cred = await createUserWithEmailAndPassword(userAdminAuth, email, password);
  await signOut(userAdminAuth);
  return cred.user.uid;
}
// Keep a copy of the data on this device (IndexedDB, shared by open tabs). The app opens from the
// copy and the server sends only what changed, which saves reads when it is reopened within about
// 30 minutes (Firestore bills a full re-read after a longer gap). Falls back to memory if unavailable.
let db;
try{ db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
catch(e){ console.warn('Offline cache unavailable, using memory only', e); db = getFirestore(app); }
window.fb = {
  db, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, query, limit,
  createUser, resetPassword: email=>sendPasswordResetEmail(auth, email),
};

showCompanyBrand();
document.getElementById('btn-switch-company').addEventListener('click', ()=>openCompanySwitcher());
document.getElementById('btn-signout').addEventListener('click', async ()=>{
  await signOut(auth);
  // Don't leave the company's data on a shared computer. Clearing fails while the app is open in
  // another tab; the copy is then removed by the next sign-out with only this tab open.
  try{ await terminate(db); await clearIndexedDbPersistence(db); }
  catch(e){ console.warn('Could not clear the offline copy', e); }
  location.reload();   // drops live listeners and in-memory data
});

let started = false;
onAuthStateChanged(auth, user=>{
  if(user){
    document.getElementById('login-overlay')?.remove();
    document.getElementById('signed-in-as').textContent = user.email;
    document.getElementById('sidebar-foot').hidden = false;
    if(!started){ started = true; startApp(user); }
  }else{
    showLogin(
      (email, password)=>signInWithEmailAndPassword(auth, email, password),
      email=>sendPasswordResetEmail(auth, email),
    );
  }
});
</script>
